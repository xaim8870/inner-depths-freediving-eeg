}

/* ============================================================
   RESPONDENT FLOW (opened via #/a/<token>)
   Steps: intro -> goal -> items -> style -> state -> submit
   ============================================================ */
var RESP={pid:null,a:null,step:"intro",idx:0};
function respItems(){return PA_ITEMS;}  // solo tier = all items collected; engine tiers internally

function renderRespondent(ctx){
  var found=assessByToken(ctx.token);
  if(!found){ return respShell(respMsg("Link not found","This assessment link isn't valid. Please check with whoever sent it to you.")); }
  RESP.pid=found.pid; RESP.a=found.a;
  var a=found.a; var p=personById(found.pid);
  if(a.status==="complete"){
    return respShell(respMsg("All done","Thanks "+(p?esc(p.name.split(" ")[0]):"")+" — you've already completed this assessment. Your results have been shared back to you if access was granted.",true));
  }
  a.status=a.status==="invited"?"progress":a.status;
  if(!a.started){a.started=Date.now();}

  var step=RESP.step;
  if(step==="intro")return respShell(respIntro(p));
  if(step==="goal")return respShell(respGoal());
  if(step==="items")return respShell(respItemsScreen());
  if(step==="style")return respShell(respStyleScreen());
  if(step==="state")return respShell(respStateScreen());
  return respShell(respIntro(p));
}
function respShell(inner){
  return '<div class="assess-wrap"><div class="assess-top"><img src="'+LOGO+'" alt=""/><div><div class="bt1">Inner&nbsp;<span>Depths</span></div></div></div>'+inner+'</div>';
}
function respMsg(h,sub,ok){
  return '<div class="card" style="text-align:center;padding:36px 22px">'
    +'<div class="ei" style="width:52px;height:52px;border-radius:14px;background:'+(ok?"var(--seafoam)":"#fbeee9")+';display:grid;place-items:center;color:'+(ok?"var(--tidal)":"var(--coral)")+';margin:0 auto 14px">'+ico(ok?IC.check:IC.info)+'</div>'
    +'<h3 style="font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--abyss);margin-bottom:6px">'+esc(h)+'</h3>'
    +'<p style="color:var(--ink-soft);line-height:1.55">'+esc(sub)+'</p></div>';
}
function respIntro(p){
  return '<div class="card">'
    +'<div class="eye">Performance assessment</div>'
    +'<h2 style="font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--abyss);margin:8px 0 10px">Map where to focus your mental training</h2>'
    +'<p style="color:var(--ink-soft);line-height:1.6">Hi '+(p?esc(p.name.split(" ")[0]):"there")+'. This takes about 10 minutes. You\'ll answer a set of short statements, tell us your goal, and check in on how you feel right now. There are no right answers — it just helps match your training.</p>'
    +'<div class="notice" style="margin-top:14px">'+ico(IC.info)+' &nbsp;This is dry preparation only. It\'s not a medical assessment and never covers in-water or breath-hold coaching.</div>'
    +'<div class="afoot"><button class="btn btn-primary" style="width:100%;justify-content:center" data-rstep="goal">Begin</button></div>'
  +'</div>';
}
function respGoal(){
  var a=RESP.a;
  var cards=PA_GOALS.map(function(g){var sel=(a.goal===g.id);
    return '<div class="goalcard'+(sel?" sel":"")+'" data-goal="'+g.id+'"><div style="flex:1"><div class="gt">'+esc(g.label)+'</div></div><div class="rad"></div></div>';}).join("");
  return '<div class="prog"><i style="width:16%"></i></div>'
    +'<div class="eye">Step 1 of 4 · Your goal</div>'
    +'<h2 style="font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--abyss);margin:6px 0 4px">What do you most want to work on?</h2>'
    +'<p class="rintro">Pick the one that fits best right now. It frames the rest — you can\'t get it wrong.</p>'
    +cards
    +'<div class="afoot"><button class="btn btn-primary" style="width:100%;justify-content:center" data-rstep="items" '+(a.goal&&a.goal!=="none"||a.goal==="none"?"":"disabled")+'>Continue</button></div>';
}
function respItemsScreen(){
  var items=respItems(); var a=RESP.a;
  var answered=items.filter(function(it){return a.responses[it.id]!=null;}).length;
  var pct=16+Math.round(answered/items.length*44);
  var s='<div class="prog"><i style="width:'+pct+'%"></i></div>'
    +'<div class="eye">Step 2 of 4 · Statements</div>'
    +'<h2 style="font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--abyss);margin:6px 0 4px">How much does each fit you?</h2>'
    +'<p class="rintro">Think about your typical dry training and pre-dive experience.</p>';
  items.forEach(function(it){
    var sel=a.responses[it.id];
    var srcCls=it.provisional?"src prov":"src";
    var srcTxt=it.provisional?"Provisional item":(it.source==="original"?"App-original":(it.source==="adapted"?"Adapted":"Published"));
    s+='<div class="q"><div class="qt">'+esc(it.text)+'</div><div class="'+srcCls+'"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span>'+esc(srcTxt)+'</div>'
      +'<div class="pa-scale" data-item="'+it.id+'">'+PA_SCALE.map(function(o){return '<span class="seg'+(sel===o.v?" sel":"")+'" data-val="'+o.v+'">'+esc(o.l)+'</span>';}).join("")+'</div></div>';
  });
  var done=answered===items.length;
  s+='<div class="afoot"><button class="btn btn-primary" style="width:100%;justify-content:center" data-rstep="style" '+(done?"":"disabled")+'>'+(done?"Continue":answered+" / "+items.length+" answered")+'</button></div>';
  return s;
}
function respStyleScreen(){
  var items=PA_STYLE_ITEMS; var a=RESP.a;
  var answered=items.filter(function(it){return a.responses[it.id]!=null;}).length;
  var pct=60+Math.round(answered/items.length*24);
  var s='<div class="prog"><i style="width:'+pct+'%"></i></div>'
    +'<div class="eye">Step 3 of 4 · Style</div>'
    +'<h2 style="font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--abyss);margin:6px 0 4px">A few more, about your style</h2>'
    +'<p class="rintro">No style is better than another — these only shape how we\'d coach you.</p>';
  items.forEach(function(it){
    var sel=a.responses[it.id];
    s+='<div class="q"><div class="qt">'+esc(it.text)+'</div>'
      +'<div class="pa-scale" data-item="'+it.id+'">'+PA_SCALE.map(function(o){return '<span class="seg'+(sel===o.v?" sel":"")+'" data-val="'+o.v+'">'+esc(o.l)+'</span>';}).join("")+'</div></div>';
  });
  var done=answered===items.length;
  s+='<div class="afoot"><button class="btn btn-primary" style="width:100%;justify-content:center" data-rstep="state" '+(done?"":"disabled")+'>'+(done?"Continue":answered+" / "+items.length+" answered")+'</button></div>';
  return s;
}
var STATE_SLIDERS=[
  {id:"state_arousal",label:"Right now, my physical activation is…",lo:"Flat / under-aroused",hi:"Buzzing / over-aroused"},
  {id:"state_conf",label:"Right now, my confidence is…",lo:"Shaky",hi:"Solid"},
  {id:"state_focus",label:"Right now, my focus is…",lo:"Scattered",hi:"Locked-in"}
];
function respStateScreen(){
  var a=RESP.a;
  var s='<div class="prog"><i style="width:92%"></i></div>'
    +'<div class="eye">Step 4 of 4 · Right now</div>'
    +'<h2 style="font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--abyss);margin:6px 0 4px">How are you arriving today?</h2>'
    +'<p class="rintro">A quick check-in on your current state.</p>';
  STATE_SLIDERS.forEach(function(sl){
    var v=a.state[sl.id]||3;
    s+='<div class="slider-q"><div class="qt" style="font-size:.95rem;color:var(--depth);margin-bottom:8px">'+esc(sl.label)+'</div>'
      +'<input type="range" min="1" max="5" step="1" value="'+v+'" data-state="'+sl.id+'"/>'
      +'<div class="slider-ends"><span>'+esc(sl.lo)+'</span><span>'+esc(sl.hi)+'</span></div></div>';
  });
  s+='<div class="afoot"><button class="btn btn-primary" style="width:100%;justify-content:center" data-rsubmit="1">Finish &amp; submit</button></div>';
  return s;
}

/* ============================================================
   USER PORTAL (opened via #/r/<token>) — curated result view
   ============================================================ */
function renderUserPortal(ctx){
  var found=assessByToken(ctx.token);
  if(!found)return respShell(respMsg("Link not found","This results link isn't valid. Please check with whoever shared it."));
  var a=found.a; var p=personById(found.pid);
  if(a.status!=="complete")return respShell(respMsg("Not ready yet","Your assessment results aren't ready to view. Once completed and shared, they'll appear here.",false));
  if(!a.share||!a.share.granted){
    return respShell('<div class="portal-gate"><div class="g-ico">'+ico(IC.lock)+'</div>'
      +'<h3 style="font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--abyss);margin-bottom:8px">Results not shared yet</h3>'
      +'<p style="color:var(--ink-soft);line-height:1.6">Your profile is complete, but access hasn\'t been granted yet. Check back once it\'s shared with you.</p></div>');
  }
  var inner='<div class="assess-top" style="max-width:720px;margin:0 auto 4px"><img src="'+LOGO+'" alt=""/><div><div class="bt1">Inner&nbsp;<span>Depths</span></div></div></div>';
  inner+='<div class="portal">'+renderResult(a,{curated:true,items:a.share.items,mode:"long",personName:p?p.name:""})+'</div>';

      +'</div>'

/* ---------- PDF / print export ---------- */
/* Client-side: opens a print window with the chosen result form and the
   design system inlined, then triggers the browser's Save-as-PDF.
   (Server-generated PDF is the production fidelity upgrade — see note.) */
function exportReport(pid,tier){
  var p=personById(pid), a=DB.assessments[pid];
  if(!a||a.status!=="complete"){toast("No completed assessment");return;}
  var names={athlete:"Athlete Report",workshop:"Workshop Report",coach:"Coach Dossier"};
  var body=buildReport(pid,tier);
  var css=document.querySelector("style").innerHTML;
  var w=window.open("","_blank");
  if(!w){toast("Allow pop-ups to export the report");return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Inner Depths \u2014 '+esc(p.name)+' \u2014 '+names[tier]+'</title>'
    +'<style>'+css+'</style>'
    +'<style>body{background:#fff;padding:0}.rptwrap{max-width:820px;margin:0 auto;padding:26px 30px 40px}@page{margin:14mm}</style>'
    +'</head><body><div class="rptwrap rpt">'+body+'</div></body></html>');
  w.document.close();
  setTimeout(function(){try{w.focus();w.print();}catch(e){}},420);
}

/* Preview a tier in-app (no print dialog) */
function previewReport(pid,tier){
  UI.route="preview"; UI.personId=pid; UI.previewTier=tier; MODAL=null; paint(); window.scrollTo(0,0);
}

/* ---------- main paint ---------- */
function paint(){
  var ctx=parseHash();
  if(ctx.kind==="assess"){ root().innerHTML=renderRespondent(ctx); bindRespondent(); return; }
  if(ctx.kind==="result"){ root().innerHTML=renderUserPortal(ctx); return; }
  // admin app
  var inner;
  if(UI.route==="dashboard")inner=viewDashboard();
  else if(UI.route==="people")inner=viewPeople();
  else if(UI.route==="results")inner=viewResults();
  else if(UI.route==="person")inner=viewPersonResult(UI.personId);
  else if(UI.route==="preview")inner=viewPreview(UI.personId,UI.previewTier);
  else inner=viewDashboard();
  root().innerHTML=adminShell(inner)+(MODAL||"");
  bindAdmin();
}

/* ---------- admin events ---------- */
function bindAdmin(){
  var r=root();
  r.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){UI.route=b.getAttribute("data-nav");UI.personId=null;MODAL=null;paint();};});
  r.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){UI.route="person";UI.personId=b.getAttribute("data-open");MODAL=null;paint();};});
  r.querySelectorAll('[data-act="addPerson"]').forEach(function(b){b.onclick=function(){openModal(addPersonModal());};});
  r.querySelectorAll("[data-send]").forEach(function(b){b.onclick=function(){var pid=b.getAttribute("data-send");ensureAssessment(pid);saveDB();openModal(sendModal(pid));};});
  r.querySelectorAll("[data-share]").forEach(function(b){b.onclick=function(){var pid=b.getAttribute("data-share");ensureAssessment(pid);openModal(shareModal(pid));};});
  r.querySelectorAll("[data-reports]").forEach(function(b){b.onclick=function(){openModal(reportsModal(b.getAttribute("data-reports")));};});
  r.querySelectorAll("[data-export]").forEach(function(b){b.onclick=function(){var v=b.getAttribute("data-export").split(":");exportReport(v[0],v[1]);};});
  r.querySelectorAll("[data-preview]").forEach(function(b){b.onclick=function(){var v=b.getAttribute("data-preview").split(":");previewReport(v[0],v[1]);};});
  r.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){var pid=b.getAttribute("data-del");delPerson(pid);};});

  // modal-scoped
  r.querySelectorAll("[data-close]").forEach(function(b){b.onclick=closeModal;});
  var scrim=r.querySelector('[data-scrim]');if(scrim)scrim.onclick=function(e){if(e.target===scrim)closeModal();};
  r.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){copyField(b.getAttribute("data-copy"));};});

  var save=r.querySelector('[data-savePerson]');if(save)save.onclick=savePerson;
  var saveShare=r.querySelector('[data-saveShare]');if(saveShare)saveShare.onclick=function(){saveShareFn(saveShare.getAttribute("data-saveShare"));};

  // share modal live interactions
  var grant=r.querySelector('#sh_grant');
  if(grant)grant.onclick=function(){var b=r.querySelector('#sh_body');if(b){b.style.opacity=grant.checked?"1":".5";b.style.pointerEvents=grant.checked?"auto":"none";}};
  r.querySelectorAll("[data-shitem]").forEach(function(el){el.onclick=function(){el.classList.toggle("on");};});
}

function copyField(id){
  var el=document.getElementById(id);if(!el)return;
  var txt=el.value!=null?el.value:el.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Copied");},function(){legacyCopy(el);});}
  else legacyCopy(el);
}
function legacyCopy(el){try{el.select&&el.select();document.execCommand("copy");toast("Copied");}catch(e){toast("Copy failed — select manually");}}

function savePerson(){
  var name=(document.getElementById("np_name")||{}).value||"";
  name=name.trim(); if(!name){toast("Name is required");return;}
  var pers={id:uid("p"),name:name,
    email:((document.getElementById("np_email")||{}).value||"").trim(),
    phone:((document.getElementById("np_phone")||{}).value||"").trim(),
    note:((document.getElementById("np_note")||{}).value||"").trim(),
    created:Date.now()};
  DB.people.unshift(pers);
  ensureAssessment(pers.id);
  saveDB();
  MODAL=null; UI.route="people"; paint();
  toast("Added "+pers.name);
}
function delPerson(pid){
  var p=personById(pid);
  if(!confirm("Delete "+(p?p.name:"this person")+" and their assessment? This can't be undone."))return;
  DB.people=DB.people.filter(function(x){return x.id!==pid;});
  delete DB.assessments[pid];
  saveDB(); paint(); toast("Deleted");
}
function saveShareFn(pid){
  var a=ensureAssessment(pid);
  var grant=document.getElementById("sh_grant");
  a.share.granted=grant?grant.checked:false;
  root().querySelectorAll("[data-shitem]").forEach(function(el){
    a.share.items[el.getAttribute("data-shitem")]=el.classList.contains("on");
  });
  saveDB(); MODAL=null; paint();
  toast(a.share.granted?"Sharing on":"Sharing off");
}

/* ---------- respondent events ---------- */
function bindRespondent(){
  var r=root();
  r.querySelectorAll("[data-rstep]").forEach(function(b){b.onclick=function(){RESP.step=b.getAttribute("data-rstep");saveDB();paint();window.scrollTo(0,0);};});
  r.querySelectorAll("[data-goal]").forEach(function(el){el.onclick=function(){RESP.a.goal=el.getAttribute("data-goal");saveDB();paint();};});
  r.querySelectorAll("[data-item]").forEach(function(sc){
    sc.querySelectorAll("[data-val]").forEach(function(seg){
      seg.onclick=function(){var id=sc.getAttribute("data-item");RESP.a.responses[id]=parseInt(seg.getAttribute("data-val"),10);saveDB();
        var y=window.scrollY;paint();window.scrollTo(0,y);};
    });
  });
  r.querySelectorAll("[data-state]").forEach(function(sl){
    sl.oninput=function(){RESP.a.state[sl.getAttribute("data-state")]=parseInt(sl.value,10);};
    sl.onchange=function(){saveDB();};
  });
  var sub=r.querySelector("[data-rsubmit]");
  if(sub)sub.onclick=function(){
    // ensure all state sliders captured with defaults
    STATE_SLIDERS.forEach(function(s){if(RESP.a.state[s.id]==null)RESP.a.state[s.id]=3;});
    RESP.a.status="complete"; RESP.a.completed=Date.now();
    snapshotProfile(RESP.a);
    saveDB();
    root().innerHTML=respShell(respMsg("Submitted — thank you","Your responses are in. If your coach grants access, you'll be able to see your performance profile from the link they share.",true));
    window.scrollTo(0,0);
  };
}

    out+='<div class="tr-card">'
      +'<div class="tr-t">'+esc(sd.title)+'</div>'
      +'<div class="tr-track"><span class="tr-end'+(sd.side==="lo"?" on":"")+'">'+esc(sd.lo)+'</span>'
        +'<div class="tr-bar"><span style="left:'+pos+'%"></span></div>'
        +'<span class="tr-end r'+(sd.side==="hi"?" on":"")+'">'+esc(sd.hi)+'</span></div>'
      +'<div class="tr-strength">'+esc(sd.strength)+'</div>'
      +(withSkill?'<div class="tr-skill"><span class="tr-sk-l">Train this</span>'+esc(sd.skill||midSkill(sd))+'</div>':'')
    +'</div>';
  });
  return out+'</div>';
}


/* Mid-band traits get guidance too — the engine leaves .skill empty at mid. */
function midSkill(sd){
  var m={ext:"You can work solo or with partners equally well \u2014 pick per session rather than defaulting to one.",
    con:"You can plan or go by feel. Choose deliberately at the start of each block so it stays a choice, not a drift.",
    opn:"You balance proven drills with new ones \u2014 keep one stable core drill while you sample around it.",
    agr:"You cooperate without losing your own line \u2014 useful for buddy work where safety needs candour.",
    emo:"You read your body clearly without being thrown by it \u2014 a good platform for regulation training."};
  return m[sd.dim]||"This sits mid-range \u2014 you can lean either way depending on what the session needs.";
}

/* ---------- construct table (coach tier) ---------- */
function rptConstructs(r){
  var c=r.c;
  var rows=[["Somatic anxiety",c.somatic,"Physical activation before/around performance"],
    ["Cognitive worry",c.worry,"Worry-based thought content"],
    ["Concentration disruption",c.concentration,"Attention pulled off-task"],
    ["Debilitative interpretation",c.debilitative,"Reads activation as harmful vs. helpful"],
    ["Reinvestment / over-control",c.reinvestment,"Conscious control of automated movement"],
    ["Self-efficacy",c.efficacy,"Belief in own capability"],
    ["Sensation-seeking",c.sensation,"Draw toward novel/intense experience"]];
  var out='<table class="rpt-tbl"><thead><tr><th>Construct</th><th style="width:34%">Score</th><th style="width:38%">What it indexes</th></tr></thead><tbody>';
  rows.forEach(function(row){
    var v=(row[1]==null||isNaN(row[1]))?null:row[1];
    var w=v==null?2:Math.round(Math.max(2,(v-1)/4*100));
    var band=v==null?"":(v>=4?"hi":v<=2?"lo":"mid");
    out+='<tr><td class="rt-n">'+esc(row[0])+'</td>'
      +'<td><div class="rt-bar"><div class="rt-tk"><span style="width:'+w+'%"></span></div>'
        +'<span class="rt-v mono">'+(v==null?"—":v.toFixed(1))+'</span>'
        +(band?'<span class="rt-band '+band+'">'+(band==="hi"?"High":band==="lo"?"Low":"Mid")+'</span>':'')+'</div></td>'
      +'<td class="rt-d">'+esc(row[2])+'</td></tr>';
  });
  return out+'</tbody></table>';
}

/* ---------- plan (athlete + coach) ---------- */
function rptPlan(r,detailed){
  var fo=nfMod("foundation"), nf=nfMod(r.rec.nf), mw=mwProg(r.rec.mw);
  var steps=[
    ["1","Set your baseline","First session","A subjective check-in plus a short resting capture, so everything after is measured against your own starting point.","var(--current)"],
    ["2",fo.n,"Foundation","A calm breathing lead-in that runs underneath every pathway — the platform the rest is built on.",fo.c],
    ["3",nf.n,"Neurofeedback · exploratory",nfBlurb(r.rec.nf),nf.c],
    ["4",mw.n,"Mind Work · CBT",mwBlurb(r.rec.mw)+(r.rec.swapped?" Body signals led here, so this leans on panic-literacy first.":""),mw.c]
  ];
  var out='<div class="rpt-plan">';
  steps.forEach(function(s){
    out+='<div class="rp-step"><div class="rp-num" style="background:'+s[4]+'">'+s[0]+'</div>'
      +'<div class="rp-body"><div class="rp-k">'+esc(s[2])+'</div><div class="rp-t">'+esc(s[1])+'</div>'
      +'<div class="rp-d">'+esc(s[3])+'</div></div></div>';
  });
  out+='</div>';
  if(detailed&&r.mods.length){
    out+='<div class="rpt-callout"><div class="rc-l">Personal adjustments</div>';
    r.mods.forEach(function(m){out+='<div class="rc-i"><b>'+esc(m.tag)+':</b> '+esc(m.text)+'</div>';});
    out+='</div>';
  }
  return out;
}
function nfBlurb(id){
  return {calm:"Training that biases toward down-regulation — settling physical activation on demand rather than waiting for it to pass.",
    focus:"Training that biases toward attentional stability — holding a steady focus without gripping it."}[id]
    ||"Matched to your leading focus area.";}
function mwBlurb(id){
  return {nerves:"A CBT program for dive-day nerves: what the activation is, why it shows up, and how to work with it instead of against it.",
    focus:"A CBT program for overthinking: loosening conscious control of movement that should already be automatic.",
    confidence:"A CBT program for confidence and self-belief: building evidence-based belief rather than forced positivity.",
    panic:"A CBT program on body sensations and panic literacy: learning to read your body's signals accurately."}[id]
    ||"Matched to your leading focus area.";}

/* ---------- drivers ---------- */
function rptDrivers(r){
  var top=r.rec.drivers.slice(0,3), tot=top.reduce(function(s,x){return s+x.contrib;},0)||1;
  var out='<div class="rpt-drivers">';
  top.forEach(function(d){
    var share=Math.round(d.contrib/tot*100);
    out+='<div class="rd-row"><span class="rd-l">'+esc(d.label)+'</span>'
      +'<div class="rd-tk"><span style="width:'+Math.max(6,share)+'%"></span></div>'
      +'<span class="rd-v mono">'+share+'%</span></div>';
  });
  return out+'</div>';
}


/* ============================================================
   TIER COMPOSITIONS
   ============================================================ */
function buildReport(pid,tier){
  var p=personById(pid), a=DB.assessments[pid];
  var r=computeResult(a);
  var body="";

  if(tier==="athlete"){
    body=rptCover(p,a,tier,{kicker:"Athlete report"})
      +'<section class="rpt-pg">'
        +rptSectionHead("01","Your profile","Where your mental training will pay off fastest.")
        +rptProfileHero(r,tier)
        +'<div class="rpt-why">'+rptSectionHead("02","Why this is your focus","The answers that pushed hardest toward this result.")
          +rptDrivers(r)+'</div>'
      +'</section>'
      +'<section class="rpt-pg">'
        +rptSectionHead("03","Your traits, and how to train with them",
          "No trait here is better than another. Each one is a strength with a matched skill that turns it into an advantage.")
        +rptTraits(r,true)
      +'</section>'
      +'<section class="rpt-pg">'
        +rptSectionHead("04","Your training plan","Follow this in order. Each step builds the platform for the next.")
        +rptPlan(r,true)
        +rptTodayBlock(r)
      +'</section>';
  }

  if(tier==="workshop"){
    body=rptCover(p,a,tier,{kicker:"Workshop report"})
      +'<section class="rpt-pg">'
        +rptSectionHead("01","Your profile","The pattern your assessment revealed.")
        +rptProfileHero(r,tier)
        +'<div class="rpt-why">'+rptSectionHead("02","What shaped this result","The strongest contributors to your leading area.")
          +rptDrivers(r)+'</div>'
      +'</section>'
      +'<section class="rpt-pg">'
        +rptSectionHead("03","Your traits","Your natural tendencies, and the strength each one carries.")
        +rptTraits(r,false)
        +'<div class="rpt-callout soft"><div class="rc-l">Where this goes next</div>'
          +'<div class="rc-i">Your profile points to a clear starting direction: <b>'+esc(nfMod(r.rec.nf).n)+'</b> paired with the <b>'+esc(mwProg(r.rec.mw).n)+'</b> program. '
          +'The applied protocols — how to run each session, what to adjust when it isn\u2019t working, and practising them with feedback — are covered in the workshop.</div></div>'
      +'</section>'
      +rptWorkshopCTA(r);
  }

  if(tier==="coach"){
    body=rptCover(p,a,tier,{kicker:"Coach \u00b7 confidential"})
      +'<section class="rpt-pg">'
        +'<div class="rpt-conf">Confidential \u00b7 prepared for the coach working with '+esc(p.name)+'. Contains full technical scoring and routing rationale.</div>'
        +rptSectionHead("01","Profile summary","Leading pathway and distribution.")
        +rptProfileHero(r,tier)
        +rptRoutingPanel(r)
      +'</section>'
      +'<section class="rpt-pg">'
        +rptSectionHead("02","Technical appendix \u00b7 construct scores",
          "Raw construct means on the 1\u20135 response scale. These underlie the pathway distribution above.")
        +rptConstructs(r)
        +rptStateBlock(r)
      +'</section>'
      +'<section class="rpt-pg">'
        +rptSectionHead("03","Athlete traits \u00b7 coaching implications",
          "How this athlete is likely to respond to coaching, and what to pair with each tendency.")
        +rptTraits(r,true)
      +'</section>'
      +'<section class="rpt-pg">'
        +rptSectionHead("04","Session plan & progression","Recommended sequence, with markers for when to advance.")
        +rptPlan(r,true)
        +rptProgression(r)
        +rptCoachNotes(r)
      +'</section>';
  }

  return body+rptFooter(tier);
}

/* ---------- supporting blocks ---------- */
function rptTodayBlock(r){
  var sa=r.state.state_arousal||3;
  var txt=sa>=4?"You reported arriving over-aroused. On days like that, lead with the breathing down-regulation before anything technical \u2014 the technical work lands better once activation settles."
    :sa<=2?"You reported arriving flat. On days like that, a short activating routine before the main work will get more out of the session."
    :"You reported arriving in a workable middle band \u2014 you can go straight into your focus area.";
  return '<div class="rpt-callout"><div class="rc-l">On the day you were assessed</div><div class="rc-i">'+esc(txt)+'</div></div>';
}
function rptStateBlock(r){
  var s=r.state, m={1:"Very low",2:"Low",3:"Mid",4:"High",5:"Very high"};
  return '<div class="rpt-sub">Self-reported state at time of assessment</div>'
    +'<table class="rpt-tbl compact"><tbody>'
    +'<tr><td class="rt-n">Physical activation</td><td class="mono">'+(s.state_arousal||3)+' / 5</td><td class="rt-d">'+esc(m[s.state_arousal||3])+'</td></tr>'
    +'<tr><td class="rt-n">Confidence</td><td class="mono">'+(s.state_conf||3)+' / 5</td><td class="rt-d">'+esc(m[s.state_conf||3])+'</td></tr>'
    +'<tr><td class="rt-n">Focus</td><td class="mono">'+(s.state_focus||3)+' / 5</td><td class="rt-d">'+esc(m[s.state_focus||3])+'</td></tr>'
    +'</tbody></table>'
    +'<div class="rpt-fine">State measures are single-occasion self-report and should be read as context for the session, not as stable traits.</div>';
}
function rptRoutingPanel(r){
  var res=r.resolved;
  var g=(res.goal&&res.goal.id!=="none")?res.goal.label:"None stated";
  return '<div class="rpt-routing">'
    +'<div class="rr-h"><span class="rr-t">Routing rationale</span><span class="rr-tag">'+esc(basisTag(res.basis))+'</span></div>'
    +'<div class="rr-g"><span>Stated goal</span><b>'+esc(g)+'</b></div>'
    +'<div class="rr-n">'+esc(res.note)+'</div>'
    +(res.secondaryPathway?'<div class="rr-n">Secondary thread queued: <b>'+esc(res.secondaryPathway)+'</b>.</div>':'')
    +(res.mechanism?'<div class="rr-m">Response-style read: '+res.mechanism.ranked.map(function(x){return esc(x.label)+" "+Math.round(x.v*100)+"%";}).join(" \u00b7 ")+'</div>':'')
    +'<div class="rr-f">v12 two-input routing (scores + stated goal). Blend margin and adapted items are provisional and awaiting validation against real intake data.</div>'
  +'</div>';
}
function rptProgression(r){
  var rows=[
    ["Weeks 1\u20132","Baseline + foundation","Consistency is the marker \u2014 completed sessions matter more than session quality at this stage."],
    ["Weeks 3\u20134","Add the matched module","Advance when the foundation runs without effort and the athlete can self-report state accurately."],
    ["Weeks 5\u20138","Mind Work in parallel","Advance when the athlete applies the skill unprompted in a dry session, not just when cued."],
    ["Review","Re-assess","Re-run the assessment and compare the construct profile, not just the leading pathway."]
  ];
  var out='<div class="rpt-sub">Progression markers</div><table class="rpt-tbl compact"><tbody>';
  rows.forEach(function(x){out+='<tr><td class="rt-n" style="width:20%">'+esc(x[0])+'</td><td style="width:30%"><b>'+esc(x[1])+'</b></td><td class="rt-d">'+esc(x[2])+'</td></tr>';});
  return out+'</tbody></table>';
}
function rptCoachNotes(r){
  var notes=[];
  var c=r.c;
  if(c.debilitative!=null&&c.debilitative<=2)notes.push("Low debilitative score: this athlete reads activation as harmful. Reframing what the activation means is likely to move more than any relaxation technique.");
  if(c.reinvestment!=null&&c.reinvestment>=4)notes.push("High reinvestment: avoid adding technical cues under pressure. More instruction will likely make performance worse, not better.");
  if(c.efficacy!=null&&c.efficacy<=2)notes.push("Low self-efficacy: build from mastery evidence the athlete already has. Verbal reassurance tends not to hold at depth.");
  if(c.somatic!=null&&c.somatic>=4)notes.push("High somatic loading: prioritise interoceptive accuracy \u2014 the athlete needs to read their own signals correctly before regulating them.");
  if(c.sensation!=null&&c.sensation>=4)notes.push("High sensation-seeking: watch for progression outpacing skill. Structural limits will hold better than cautionary advice.");
  if(!notes.length)notes.push("No individual flags from the construct profile. Follow the standard progression above.");
  var out='<div class="rpt-callout"><div class="rc-l">Coaching notes</div>';
  notes.forEach(function(n){out+='<div class="rc-i">'+esc(n)+'</div>';});
  return out+'</div>';
}
function rptWorkshopCTA(r){
  var covers=[
    ["Running the protocols","Step-by-step delivery of the modules matched to your profile \u2014 with practice and live feedback."],
    ["Adjusting under pressure","What to change when a session isn\u2019t working, and how to tell the difference between a bad day and a bad fit."],
    ["Reading your own signals","Building interoceptive accuracy \u2014 the skill underneath every regulation technique."],
    ["Building your own plan","Turning this profile into a training block you can run and review on your own."]
  ];
  var out='<section class="rpt-pg"><div class="rpt-cta">'
    +'<div class="ct-k">Next step</div>'
    +'<h2>Put this profile to work</h2>'
    +'<p>Your report shows the pattern and the starting direction. The workshop is where the applied protocols get taught \u2014 practised, adjusted to you, and rehearsed with feedback until they hold up under pressure.</p>'
    +'<div class="ct-grid">';
  covers.forEach(function(c){out+='<div class="ct-i"><div class="ct-it">'+esc(c[0])+'</div><div class="ct-id">'+esc(c[1])+'</div></div>';});
  out+='</div>'
    +'<div class="ct-f">Bring this report with you \u2014 sessions are built around the profiles in the room.</div>'
  +'</div></section>';
  return out;
}
function rptFooter(tier){
  var base="Provisional (v12). Built from self-report \u2014 tendencies, not fixed traits or clinical states. Routing weights are reasoned but not yet validated; treat recommendations as a considered starting point, not a verdict. Supports dry training and pre-dive mental preparation only \u2014 never in-water coaching or breath-hold supervision. Never dive alone.";
  var extra=tier==="coach"?" Neurofeedback content is exploratory; EEG values from consumer hardware are approximations, not clinical measurements.":"";
  return '<div class="rpt-legal">'+esc(base+extra)+'</div>';
}
