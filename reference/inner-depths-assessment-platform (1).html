<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
:root{
  --mist:#F2F8F7; --seafoam:#DCEEEA; --lumen:#7FE6DE; --tidal:#46B3A9;
  --current:#2E7D97; --depth:#12455A; --abyss:#0B2A38; --sand:#E4C79C; --coral:#D98873;
  --ink:#0B2A38; --ink-soft:#3B5B67; --brand:#1AC2DF;
  --display:"DM Serif Display",Georgia,serif; --body:"DM Sans",system-ui,-apple-system,sans-serif;
  --shadow-sm:0 1px 3px rgba(11,42,56,.08); --shadow-md:0 6px 22px rgba(11,42,56,.10);
  --line:#d7e8e4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--mist);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.92rem}
a{color:var(--current)}
.hide{display:none!important}
.mono{font-variant-numeric:tabular-nums}

/* ---------- App frame ---------- */
.app{display:flex;min-height:100vh}
.side{width:230px;flex:0 0 230px;background:var(--abyss);color:#cfe6e0;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.side .logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.side .logo img{width:34px;height:34px;border-radius:8px}
.side .logo .bt1{font-family:var(--display);font-size:1.02rem;color:#fff;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.side .logo .bt1 span{color:var(--lumen)}
.side .logo .bt2{font-size:.5rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#7fa6ad;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#a9c9c9;padding:10px 12px;border-radius:10px;font-size:.9rem;font-weight:500}
.nav button svg{width:18px;height:18px;flex:0 0 auto}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--current);color:#fff}
.side .foot{margin-top:auto;font-size:.68rem;color:#6f9298;line-height:1.5;padding:10px 10px 2px;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 30px;border-bottom:1px solid var(--line);background:#fff}
.topbar h1{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--abyss)}
.topbar .sub{font-size:.82rem;color:var(--ink-soft);margin-top:1px}
.wrap{padding:26px 30px;max-width:1080px;width:100%}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--depth);padding:.5rem .9rem;border-radius:10px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--tidal)}
.btn-primary{background:var(--current);border-color:var(--current);color:#fff}
.btn-primary:hover{background:var(--depth);border-color:var(--depth)}
.btn-ghost{background:none;border:none;color:var(--current);padding:.4rem .5rem}
.btn-danger{color:var(--coral);border-color:#eccabf}
.btn-danger:hover{background:#fbeee9}
.btn-sm{padding:.32rem .6rem;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Cards / tables ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.grid.k3{grid-template-columns:repeat(3,1fr)}
.grid.k4{grid-template-columns:repeat(4,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tidal)}
.stat .v{font-family:var(--display);font-size:1.9rem;color:var(--abyss);margin-top:6px;line-height:1}
.stat .d{font-size:.76rem;color:var(--ink-soft);margin-top:4px}

table{width:100%;border-collapse:collapse}
th{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--seafoam);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowhover:hover{background:#f6fbfb}
.tname{font-weight:600;color:var(--depth)}
.tsub{font-size:.78rem;color:var(--ink-soft)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.badge i{width:6px;height:6px;border-radius:50%}
.b-invited{background:#fef4ec;color:#b56a4e}.b-invited i{background:var(--coral)}
.b-progress{background:#eaf3f6;color:var(--current)}.b-progress i{background:var(--current)}
.b-complete{background:#e2f4ef;color:#1f7d69}.b-complete i{background:var(--tidal)}
.b-shared{background:#e9f0ff;color:#3f5bd9}.b-shared i{background:#3f5bd9}
.b-none{background:#eef2f3;color:#6b8790}.b-none i{background:#9db4bb}

.eye{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tidal)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--abyss)}

/* ---------- Forms ---------- */
label.fl{display:block;font-size:.76rem;font-weight:600;color:var(--depth);margin:0 0 5px}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;color:var(--ink);background:#fff}
.field:focus{outline:none;border-color:var(--tidal);box-shadow:0 0 0 3px rgba(70,179,169,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.help{font-size:.76rem;color:var(--ink-soft);margin-top:5px;line-height:1.45}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,42,56,.42);display:grid;place-items:center;padding:20px;z-index:60}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-md);width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--abyss)}
.modal .mb{padding:20px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.x{background:none;border:none;color:var(--ink-soft);font-size:1.3rem;line-height:1;width:30px;height:30px;border-radius:8px}
.x:hover{background:var(--seafoam)}

/* ---------- Link/share box ---------- */
.linkbox{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.linkbox input{flex:1;font-size:.82rem;background:var(--mist);border:1px dashed var(--tidal);border-radius:10px;padding:.55rem .7rem;color:var(--depth)}
.notice{font-size:.82rem;color:var(--ink-soft);background:#f6fbfb;border:1px solid var(--seafoam);border-left:3px solid var(--sand);border-radius:0 10px 10px 0;padding:10px 12px;line-height:1.5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--abyss);color:#fff;padding:.7rem 1.2rem;border-radius:12px;font-size:.86rem;box-shadow:var(--shadow-md);z-index:80;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ---------- Toggle ---------- */
.tog{position:relative;width:42px;height:24px;flex:0 0 auto}
.tog input{opacity:0;width:0;height:0}
.tog .tk{position:absolute;inset:0;background:#c7d8d5;border-radius:999px;transition:.2s}
.tog .tk:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog input:checked+.tk{background:var(--tidal)}
.tog input:checked+.tk:before{transform:translateX(18px)}

/* ---------- Assessment (respondent) ---------- */
.assess-wrap{max-width:560px;margin:0 auto;padding:26px 18px 60px}
.assess-top{display:flex;align-items:center;gap:10px;padding:6px 2px 18px}
.assess-top img{width:34px;height:34px;border-radius:8px}
.assess-top .bt1{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--depth);font-size:1.02rem}
.assess-top .bt1 span{color:var(--current)}
.prog{height:6px;background:var(--seafoam);border-radius:999px;overflow:hidden;margin:0 0 20px}
.prog>i{display:block;height:100%;background:var(--tidal);border-radius:999px;transition:width .3s}
.q{margin:0 0 18px}
.q .qt{font-size:1rem;color:var(--depth);font-weight:500;line-height:1.45;margin-bottom:2px}
.q .src{font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6b8790;display:inline-flex;align-items:center;gap:5px;margin-bottom:10px}
.q .src.prov{color:var(--coral)}
.pa-scale{display:flex;gap:6px;flex-wrap:wrap}
.seg{flex:1;min-width:84px;text-align:center;font-size:.78rem;font-weight:500;color:var(--depth);background:#fff;border:1px solid var(--line);border-radius:10px;padding:.55rem .3rem}
.seg:hover{border-color:var(--tidal)}
.seg.sel{background:var(--current);color:#fff;border-color:var(--current)}
.slider-q{margin:0 0 22px}
.slider-q input[type=range]{width:100%;accent-color:var(--tidal)}
.slider-ends{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-soft);margin-top:4px}
.goalcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff}
.goalcard:hover{border-color:var(--tidal)}
.goalcard.sel{border-color:var(--current);background:#f4fbfa;box-shadow:0 0 0 2px rgba(46,125,151,.12)}
.goalcard .gt{font-weight:600;color:var(--depth);font-size:.92rem}
.goalcard .rad{width:20px;height:20px;border-radius:50%;border:2px solid #c3d6d2;flex:0 0 auto}
.goalcard.sel .rad{border-color:var(--current);background:var(--current);box-shadow:inset 0 0 0 3px #fff}
.afoot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--mist) 30%);padding:16px 0 6px;margin-top:10px}

/* ---------- Result view (shared with PDF) ---------- */
.result{max-width:720px;margin:0 auto}
.pa-summary{background:var(--abyss);color:#eaf6f4;border-radius:18px;padding:22px 22px 20px}
.pa-summary .eye{color:var(--lumen)}
.pa-summary h2{font-family:var(--display);font-weight:400;font-size:1.7rem;color:#fff;margin:8px 0 8px}
.pa-summary p{font-size:.92rem;color:#cfeae6;line-height:1.55}
.pa-splitbar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:16px 0 10px;background:rgba(255,255,255,.1)}
.pa-splitbar>span{display:block;height:100%}
.pa-splitleg{display:flex;flex-wrap:wrap;gap:12px}
.pa-splitleg>span{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#dff2ef}
.pa-splitleg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pa-mini{margin-top:16px;font-size:.82rem;color:#bfe6e0;background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px}
.res-sec{margin-top:22px}
.res-sec .eye{margin-bottom:8px;display:block}
.rintro{font-size:.9rem;color:var(--ink-soft);line-height:1.55;margin:0 0 12px}
.pa-flow{display:flex;flex-direction:column;gap:0}
.pa-node{display:flex;gap:12px;padding:12px 0;position:relative}
.pa-node:not(:last-child):after{content:"";position:absolute;left:15px;top:40px;bottom:-2px;width:2px;background:var(--seafoam)}
.pa-node .num{width:32px;height:32px;flex:0 0 auto;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem;z-index:1}
.pa-node .nt{font-weight:600;color:var(--depth);font-size:.95rem}
.pa-node .nk{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tidal)}
.pa-node .nd{font-size:.84rem;color:var(--ink-soft);line-height:1.45;margin-top:2px}
.pa-dbar{display:flex;align-items:center;gap:10px;margin:8px 0}
.pa-dbar .lb{flex:0 0 42%;font-size:.84rem;color:var(--depth)}
.pa-dbar .tk{flex:1;height:9px;background:var(--seafoam);border-radius:999px;overflow:hidden}
.pa-dbar .tk>span{display:block;height:100%;background:var(--tidal);border-radius:999px}
.pa-dbar .vl{font-size:.8rem;font-weight:600;color:var(--current);width:38px;text-align:right}
.style-row{margin:10px 0}
.style-row .st{font-weight:600;color:var(--depth);font-size:.9rem;margin-bottom:8px}
.style-track{display:flex;align-items:center;gap:8px}
.style-track .end{font-size:.72rem;flex:1;color:var(--ink-soft)}
.style-track .end.on{color:var(--depth);font-weight:600}
.style-track .end.r{text-align:right}
.style-track .bar{flex:1.6;height:8px;background:var(--seafoam);border-radius:999px;position:relative}
.style-track .bar>span{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--tidal);border:2px solid #fff;box-shadow:0 1px 3px rgba(11,42,56,.3)}
.style-strength{font-size:.85rem;color:var(--ink-soft);line-height:1.5;margin-top:8px}
.prov-panel{border:1px dashed var(--tidal);background:#f6fbfb;border-radius:14px;padding:16px;margin-top:14px}
.prov-panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prov-panel .pl{font-weight:600;color:var(--depth);font-size:.9rem}
.prov-panel .pl .pf{font-weight:600;color:var(--coral)}
.prov-tag{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tidal);background:#dbf0ec;padding:3px 9px;border-radius:20px}
.prov-panel .pd{font-size:.85rem;color:var(--depth);line-height:1.5;margin-top:8px}
.prov-fine{font-size:.74rem;color:var(--ink-soft);margin-top:10px;border-top:1px solid #e4eef0;padding-top:8px;line-height:1.5}
.nf-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--seafoam);font-size:.86rem}
.nf-row:first-child{border-top:none}
.nf-row .nk{color:var(--ink-soft)}.nf-row .nv{color:var(--depth);font-weight:500;text-align:right}
.pill-ex{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(70,179,169,.14);color:var(--tidal);border:1px solid rgba(70,179,169,.4)}
.res-caveat{font-size:.8rem;color:#7f9aa1;line-height:1.5;margin-top:20px;border-left:3px solid var(--sand);padding-left:.85rem}

/* curated (user-facing) hides admin-only bits */
.admin-only{}
.curated .admin-only{display:none!important}

/* ---------- Selectable share checklist ---------- */
.share-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--seafoam)}
.share-item:last-child{border-bottom:none}
.share-item .si-t{font-size:.9rem;color:var(--depth);font-weight:500}
.share-item .si-d{font-size:.78rem;color:var(--ink-soft)}
.chk{width:20px;height:20px;border:2px solid #c3d6d2;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;color:#fff}
.chk.on{background:var(--tidal);border-color:var(--tidal)}
.chk svg{width:13px;height:13px;opacity:0}
.chk.on svg{opacity:1}

/* ---------- User portal ---------- */
.portal{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.portal-gate{max-width:460px;margin:60px auto;text-align:center}
.portal-gate .g-ico{width:56px;height:56px;border-radius:16px;background:var(--seafoam);display:grid;place-items:center;color:var(--current);margin:0 auto 16px}
.seg-mode{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.seg-mode button{border:none;background:none;padding:.4rem .9rem;border-radius:9px;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.seg-mode button.on{background:var(--current);color:#fff}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty .ei{width:52px;height:52px;border-radius:14px;background:var(--seafoam);display:grid;place-items:center;color:var(--tidal);margin:0 auto 14px}
.empty h3{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--abyss);margin-bottom:6px}

@media(max-width:820px){
  .side{width:64px;flex-basis:64px}
  .side .logo .bt1,.side .logo .bt2,.nav button span,.side .foot{display:none}
  .nav button{justify-content:center}
  .grid.k3,.grid.k4{grid-template-columns:1fr 1fr}
  .wrap{padding:18px}
}
@media print{
  .side,.topbar,.afoot,.no-print{display:none!important}
  body{background:#fff}
  .wrap,.result{padding:0;max-width:none}
  .pa-summary{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card,.pa-summary,.prov-panel{break-inside:avoid}
}

/* ============ REPORT STYLES (print-first, ID design system) ============ */
.rpt{color:var(--ink);font-family:var(--body)}
.rpt-pg{padding:34px 0 8px;break-inside:auto}
.rpt-pg+.rpt-pg{break-before:page;border-top:0}

/* cover */
.rpt-cover{position:relative;color:#fff;border-radius:20px;overflow:hidden;min-height:330px;display:flex;
  background:linear-gradient(150deg,#12455A 0%,#0B2A38 55%,#07202B 100%)}
.rc-bg{position:absolute;inset:0;opacity:.5;
  background:
    radial-gradient(720px 300px at 78% -8%,rgba(127,230,222,.42),transparent 62%),
    radial-gradient(520px 260px at 8% 108%,rgba(46,125,151,.55),transparent 68%)}
.rc-bg:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:92px;
  background:radial-gradient(120% 100% at 50% 100%,rgba(127,230,222,.20),transparent 70%)}
.rc-inner{position:relative;z-index:1;padding:30px 34px;display:flex;flex-direction:column;width:100%}
.rc-brand{display:flex;align-items:center;gap:11px}
.rc-brand img{width:38px;height:38px;border-radius:9px}
.rc-bt{font-family:var(--display);font-size:1.06rem;letter-spacing:.05em;color:#fff;line-height:1.05}
.rc-bs{font-size:.56rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#7fc6c9;margin-top:3px}
.rc-mid{margin-top:auto;padding:26px 0 20px}
.rc-kick{font-size:.66rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--lumen);margin-bottom:9px}
.rpt-cover h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1.08;color:#fff;letter-spacing:-.01em}
.rc-sub{font-size:.94rem;color:#bfe0dd;margin-top:9px;max-width:46ch;line-height:1.5}
.rc-meta{display:flex;gap:34px;border-top:1px solid rgba(255,255,255,.16);padding-top:15px;flex-wrap:wrap}
.rc-meta div{display:flex;flex-direction:column;gap:3px}
.rc-meta span{font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#7fa9ad}
.rc-meta b{font-size:.92rem;color:#eaf6f4;font-weight:600}

/* section heads */
.rpt-sh{display:flex;gap:14px;align-items:flex-start;margin:0 0 16px}
.rpt-n{font-family:var(--display);font-size:1.5rem;color:var(--lumen);line-height:1;padding-top:2px;
  -webkit-text-stroke:.6px var(--tidal)}
.rpt-sh h2{font-family:var(--display);font-weight:400;font-size:1.42rem;color:var(--abyss);line-height:1.2}
.rpt-sh p{font-size:.87rem;color:var(--ink-soft);margin-top:4px;line-height:1.5;max-width:62ch}
.rpt-sub{font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tidal);margin:20px 0 9px}

/* hero */
.rpt-hero{background:linear-gradient(140deg,#12455A,#0B2A38);color:#fff;border-radius:16px;padding:22px 24px}
.rh-kick{font-size:.64rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lumen)}
.rpt-hero h2{font-family:var(--display);font-weight:400;font-size:1.75rem;color:#fff;margin:8px 0 8px;line-height:1.15}
.rpt-hero p{font-size:.92rem;color:#cfe9e5;line-height:1.55;max-width:60ch}
.rh-bar{display:flex;height:13px;border-radius:999px;overflow:hidden;margin:18px 0 12px;background:rgba(255,255,255,.12)}
.rh-bar>span{display:block;height:100%}
.rh-leg{display:flex;gap:20px;flex-wrap:wrap}
.rpl{display:flex;align-items:center;gap:7px}
.rpl i{width:9px;height:9px;border-radius:3px;flex:none}
.rpl-l{font-size:.8rem;color:#dff2ef}
.rpl-v{font-size:.8rem;font-weight:700;color:#fff}
.rh-note{margin-top:14px;font-size:.83rem;color:#bfe6e0;background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;line-height:1.5}

/* why / drivers */
.rpt-why{margin-top:26px}
.rpt-drivers{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.rd-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.rd-l{flex:0 0 44%;font-size:.87rem;color:var(--depth)}
.rd-tk{flex:1;height:9px;background:var(--seafoam);border-radius:999px;overflow:hidden}
.rd-tk>span{display:block;height:100%;background:linear-gradient(90deg,var(--tidal),var(--current));border-radius:999px}
.rd-v{font-size:.82rem;font-weight:700;color:var(--current);width:38px;text-align:right}

/* traits */
.rpt-traits{display:grid;gap:12px}
.tr-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;break-inside:avoid}
.tr-t{font-weight:600;color:var(--depth);font-size:.95rem;margin-bottom:11px}
.tr-track{display:flex;align-items:center;gap:10px}
.tr-end{flex:1;font-size:.74rem;color:#8ba6ad}
.tr-end.on{color:var(--depth);font-weight:600}
.tr-end.r{text-align:right}
.tr-bar{flex:1.5;height:8px;background:var(--seafoam);border-radius:999px;position:relative}
.tr-bar>span{position:absolute;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;
  background:var(--tidal);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(11,42,56,.32)}
.tr-strength{font-size:.86rem;color:var(--ink-soft);line-height:1.5;margin-top:11px}
.tr-skill{margin-top:11px;background:var(--mist);border-left:3px solid var(--tidal);border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:.85rem;color:var(--depth);line-height:1.5}
.tr-sk-l{display:block;font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tidal);margin-bottom:4px}

/* plan */
.rpt-plan{display:flex;flex-direction:column}
.rp-step{display:flex;gap:14px;padding:13px 0;position:relative;break-inside:avoid}
.rp-step:not(:last-child):after{content:"";position:absolute;left:17px;top:46px;bottom:-4px;width:2px;background:var(--seafoam)}
.rp-num{width:36px;height:36px;flex:none;border-radius:50%;color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:.95rem;z-index:1}
.rp-k{font-size:.63rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tidal)}
.rp-t{font-weight:600;color:var(--depth);font-size:1rem;margin-top:2px}
.rp-d{font-size:.86rem;color:var(--ink-soft);line-height:1.5;margin-top:4px;max-width:64ch}

/* callouts */
.rpt-callout{background:var(--seafoam);border-radius:14px;padding:15px 17px;margin-top:18px;break-inside:avoid}
.rpt-callout.soft{background:var(--mist);border:1px solid var(--line)}
.rc-l{font-size:.63rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tidal);margin-bottom:7px}
.rc-i{font-size:.87rem;color:var(--depth);line-height:1.55}
.rc-i+.rc-i{margin-top:7px}

/* tables */
.rpt-tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rpt-tbl th{font-size:.63rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);
  text-align:left;padding:11px 14px;background:var(--mist);border-bottom:1px solid var(--line)}
.rpt-tbl td{padding:11px 14px;border-bottom:1px solid var(--seafoam);font-size:.86rem;vertical-align:middle}
.rpt-tbl tr:last-child td{border-bottom:none}
.rpt-tbl.compact td{padding:9px 14px}
.rt-n{font-weight:600;color:var(--depth)}
.rt-d{font-size:.81rem;color:var(--ink-soft);line-height:1.45}
.rt-bar{display:flex;align-items:center;gap:9px}
.rt-tk{flex:1;height:8px;background:var(--seafoam);border-radius:999px;overflow:hidden;min-width:60px}
.rt-tk>span{display:block;height:100%;background:var(--current);border-radius:999px}
.rt-v{font-weight:700;color:var(--depth);width:26px;text-align:right}
.rt-band{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.rt-band.hi{background:#fbe9e3;color:#b56a4e}
.rt-band.lo{background:#e7f2f6;color:var(--current)}
.rt-band.mid{background:#eef3f4;color:#6b8790}

/* routing panel */
.rpt-routing{border:1px dashed var(--tidal);background:#f6fbfb;border-radius:14px;padding:16px 18px;margin-top:18px}
.rr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rr-t{font-weight:600;color:var(--depth);font-size:.93rem}
.rr-tag{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tidal);
  background:#dbf0ec;padding:3px 10px;border-radius:999px}
.rr-g{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-size:.87rem;color:var(--depth)}
.rr-g span{font-size:.63rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
.rr-n{font-size:.86rem;color:var(--depth);line-height:1.5;margin-top:8px}
.rr-m{font-size:.8rem;color:var(--ink-soft);margin-top:8px}
.rr-f{font-size:.75rem;color:var(--ink-soft);line-height:1.5;margin-top:11px;border-top:1px solid #e0eced;padding-top:9px}
.rpt-fine{font-size:.75rem;color:var(--ink-soft);line-height:1.5;margin-top:9px}
.rpt-conf{font-size:.76rem;font-weight:600;color:#b56a4e;background:#fdf3ee;border:1px solid #f0d9cd;
  border-radius:10px;padding:10px 13px;margin-bottom:18px;line-height:1.45}

/* workshop CTA */
.rpt-cta{background:linear-gradient(140deg,#12455A,#0B2A38);color:#fff;border-radius:18px;padding:28px 30px;position:relative;overflow:hidden}
.rpt-cta:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(127,230,222,.26),transparent 68%)}
.ct-k{font-size:.64rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lumen)}
.rpt-cta h2{font-family:var(--display);font-weight:400;font-size:1.85rem;color:#fff;margin:9px 0 9px}
.rpt-cta p{font-size:.92rem;color:#cfe9e5;line-height:1.55;max-width:58ch}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:20px;position:relative;z-index:1}
.ct-i{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:13px 15px}
.ct-it{font-weight:600;color:#fff;font-size:.9rem}
.ct-id{font-size:.81rem;color:#bfe0dd;line-height:1.45;margin-top:5px}
.ct-f{margin-top:18px;font-size:.85rem;color:var(--lumen);font-weight:500;position:relative;z-index:1}

/* legal */
.rpt-legal{font-size:.72rem;color:#8ba6ad;line-height:1.55;margin-top:26px;padding-top:13px;border-top:1px solid var(--line)}

@media print{
  .rpt-cover,.rpt-hero,.rpt-cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rpt-pg{padding-top:22px}
  .tr-card,.rp-step,.rpt-callout,.rpt-tbl,.rpt-routing{break-inside:avoid}
  .rpt-sh{break-after:avoid}
}
@media(max-width:640px){.ct-grid{grid-template-columns:1fr}.rpt-cover h1{font-size:2rem}}


/* report picker + preview */
.rpt-pick{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--seafoam)}
.rpt-pick:last-of-type{border-bottom:none}
.rp-ic{width:38px;height:38px;flex:none;border-radius:11px;background:var(--seafoam);display:grid;place-items:center;color:var(--current)}
.rp-ic svg{width:18px;height:18px}
.rp-tx{flex:1;min-width:0}
.rp-nm{font-weight:600;color:var(--depth);font-size:.92rem}
.rp-ds{font-size:.79rem;color:var(--ink-soft);line-height:1.45;margin-top:2px}
.rp-ac{display:flex;gap:6px;flex:none}
.rpt-preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 30px 30px;box-shadow:var(--shadow-sm)}

</style>

<script>

/* ===================== VERBATIM v12 PA ENGINE ===================== */

var PA_ITEMS=[
  {id:"anx_som_1",construct:"anxiety",subscale:"somatic",tier:1,source:"published",text:"Before an important dive, my body feels tense or my stomach feels unsettled."},

  {id:"anx_dir_2",construct:"direction",subscale:"interpretation",tier:1,source:"published",text:"I read nervous energy as a sign something is wrong."},

  {id:"anx_dir_3",construct:"direction",subscale:"interpretation",tier:1,source:"adapted",provisional:true,reverse:true,text:"A rush of nerves before a dive tells me I\u2019m ready, not that I\u2019m in trouble."},
  {id:"anx_dir_4",construct:"direction",subscale:"interpretation",tier:1,source:"adapted",provisional:true,text:"If my heart is pounding beforehand, I take it as a warning sign."},

  {id:"reinv_msc_2",construct:"reinvestment",subscale:"movement_self_consciousness",tier:1,source:"adapted",provisional:true,text:"I catch myself watching my own form instead of just letting it happen."},
  {id:"reinv_cmp_1",construct:"reinvestment",subscale:"conscious_motor_processing",tier:1,source:"published",text:"Under pressure I try to consciously control movements that are usually automatic."},
  {id:"reinv_cmp_2",construct:"reinvestment",subscale:"conscious_motor_processing",tier:1,source:"published",text:"I mentally walk through each step of my technique even when I know it well."},

  {id:"reinv_dec_2",construct:"reinvestment",subscale:"decision_reinvestment",tier:1,source:"adapted",provisional:true,text:"I go back over the choices I made in a session, wondering if I got them wrong."},
  {id:"eff_1",construct:"self_efficacy",subscale:"confidence",tier:1,source:"original",text:"I trust that I can stay calm and in control during a demanding dry breath-hold session."},
  {id:"eff_2",construct:"self_efficacy",subscale:"confidence",tier:1,source:"original",text:"I believe I can reach the training targets I set for myself."},
  {id:"eff_3",construct:"self_efficacy",subscale:"confidence",tier:1,source:"original",text:"When contractions or the urge to breathe build, I feel able to ride them out (dry, within my limits)."},
  {id:"ss_1",construct:"sensation",subscale:"seeking",tier:1,source:"original",text:"The intensity and risk of depth disciplines is part of what draws me to freediving."},
  {id:"ss_2",construct:"sensation",subscale:"seeking",tier:1,source:"original",text:"I\u2019m drawn to pushing into new, more intense experiences rather than staying comfortable."},
  {id:"ach_map_1",construct:"achievement",subscale:"mastery_approach",tier:2,source:"published",text:"My aim is to master the skill itself and keep improving."},
  {id:"ach_pav_1",construct:"achievement",subscale:"performance_avoidance",tier:2,source:"published",text:"I mostly want to avoid doing worse than others or worse than before."},
  {id:"rf_pro_1",construct:"regulatory",subscale:"promotion",tier:2,source:"published",text:"I focus on gains \u2014 extending my range and achieving what I\u2019m hoping for."},
  {id:"rf_pre_1",construct:"regulatory",subscale:"prevention",tier:2,source:"published",text:"I focus on safety and being careful not to make mistakes."},
  {id:"cope_mon_1",construct:"coping",subscale:"monitoring",tier:2,source:"published",text:"When something feels off in my body, I want as much detail about it as possible."},
  {id:"cope_blu_1",construct:"coping",subscale:"blunting",tier:2,source:"published",reverse:true,text:"I cope best by distracting myself from uncomfortable sensations rather than analyzing them."},
  {id:"st_neg_1",construct:"selftalk",subscale:"negative",tier:2,source:"published",text:"Before or during a dive I hear thoughts like \u201cI can\u2019t do this\u201d or \u201csomething will go wrong\u201d."},
  {id:"st_ins_1",construct:"selftalk",subscale:"instructional",tier:2,source:"published",reverse:true,text:"I use short cue-words to direct my technique (e.g. \u201crelax shoulders\u201d, \u201cslow exhale\u201d)."},
  {id:"flow_1",construct:"flow",subscale:"disposition",tier:2,source:"published",text:"In good sessions I lose track of time and self-consciousness \u2014 it just flows."},
  /* v12 provisional: setback/adversity behavioral-avoidance response. NEW construct — app-original, exploratory, dry-land only. */
  {id:"avoid_beh_1",construct:"avoidance",subscale:"behavioral",tier:1,source:"original",provisional:true,text:"After a dive goes badly, I find reasons to put off getting back in for a while."},
  {id:"avoid_beh_2",construct:"avoidance",subscale:"behavioral",tier:1,source:"original",provisional:true,reverse:true,text:"When something rattles me, I make a point of doing it again soon so it doesn\u2019t grow into a block."}
];
var PA_STATE=[
  {id:"state_arousal",label:"Right now, my physical activation is\u2026",lo:"Flat",hi:"Buzzing"},
  {id:"state_conf",label:"Right now, my confidence is\u2026",lo:"Shaky",hi:"Solid"},
  {id:"state_focus",label:"Right now, my focus is\u2026",lo:"Scattered",hi:"Locked-in"}
];
function PA_n01(x){return (x-1)/4;}
/* ---- personality / style layer (Big Five, reframed as neutral two-sided spectra) ----
   Personality is descriptive only: it never enters routing. Every pole carries a
   genuine strength and a freediving-relevant fit; nothing is framed as a deficit.
   Grounded in five-factor personality-and-performance research (see project doc). */
var PA_STYLE_ITEMS=[
  {id:"p_ext_1",dim:"ext",text:"Being around lively groups tends to energise me."},
  {id:"p_ext_2",dim:"ext",reverse:true,text:"I do my best thinking and recharging on my own."},
  {id:"p_con_1",dim:"con",text:"I like to plan my training and then follow the plan."},
  {id:"p_con_2",dim:"con",reverse:true,text:"I\u2019d rather keep things loose and train by feel than follow a set routine."},
  {id:"p_opn_1",dim:"opn",text:"I enjoy experimenting with new techniques and ideas."},
  {id:"p_opn_2",dim:"opn",reverse:true,text:"I\u2019d rather refine what already works than try something new."},
  {id:"p_agr_1",dim:"agr",text:"I put a lot into cooperating and getting along with training partners."},
  {id:"p_agr_2",dim:"agr",reverse:true,text:"I tend to do my own thing, even if it doesn\u2019t suit everyone."},
  {id:"p_emo_1",dim:"emo",text:"I feel emotions and body sensations strongly and vividly."},
  {id:"p_emo_2",dim:"emo",reverse:true,text:"It takes a lot to rattle me \u2014 I stay on an even keel."}
];
/* each dimension: two neutral poles, a strength for each side + balanced, and an
   optional growth skill framed as building on a strength (never fixing a flaw). */
var PA_STYLE={
  ext:{title:"Where your energy comes from",lo:"Recharges in quiet",hi:"Recharges around people",
    loStrength:"You\u2019re at home in the calm, inward, solitary side of freediving \u2014 a real asset in a sport that rewards stillness.",
    hiStrength:"You draw energy from training partners and the shared stoke of a dive community.",
    midStrength:"You flex between quiet focus and shared energy \u2014 use whichever a session needs.",
    loSkill:"Solo dry practice will feel natural; dip into the community on your own terms.",
    hiSkill:"Lean on buddy sessions and the Cove \u2014 connection will keep you consistent."},
  con:{title:"How you like to work",lo:"Flexible & spontaneous",hi:"Structured & methodical",
    loStrength:"You adapt easily and train by feel \u2014 great for rolling with conditions and staying unforced.",
    hiStrength:"Planning and follow-through come naturally \u2014 consistency like this is one of the strongest drivers of steady progress.",
    midStrength:"You mix planning with going by feel, and can lean either way.",
    loSkill:"One small fixed routine (a short pre-dive sequence) makes your adaptability even more reliable \u2014 and it\u2019s quickly learned.",
    hiSkill:"An occasional \u2018train by feel\u2019 day keeps your structure from turning rigid."},
  opn:{title:"How you approach the new",lo:"Prefers the proven",hi:"Curious & experimental",
    loStrength:"You build deep mastery by refining what works \u2014 reliability is a genuine strength.",
    hiStrength:"You try new drills readily \u2014 curiosity like this tends to speed up learning.",
    midStrength:"You balance the proven with the new.",
    loSkill:"Sampling one new drill now and then, at your own pace, can unlock a plateau.",
    hiSkill:"Anchoring your experiments around one repeatable core drill keeps gains consistent."},
  agr:{title:"How you team up",lo:"Independent & candid",hi:"Cooperative",
    loStrength:"You\u2019re self-reliant and straight-talking \u2014 handy for holding your own line and speaking up on safety.",
    hiStrength:"You invest in getting along \u2014 exactly what builds the trust freediving safety depends on.",
    midStrength:"You cooperate while keeping your own line.",
    loSkill:"You can still build deep buddy trust that keeps diving safe \u2014 on your own terms.",
    hiSkill:"Buddy features and shared plans will suit you well."},
  emo:{title:"How you experience feeling",lo:"Even-keel",hi:"Strongly feeling",
    loStrength:"You stay steady when things get intense \u2014 a calm platform to build precision on.",
    hiStrength:"You feel body sensations and emotions vividly \u2014 that rich body-awareness is exactly the signal freedivers learn to work with.",
    midStrength:"You feel things clearly but aren\u2019t easily thrown.",
    loSkill:"Sharpening subtle body-awareness on top of that steadiness adds fine control.",
    hiSkill:"Your plan\u2019s regulation skills turn strong signal into steady control \u2014 a learnable skill, not a fixed trait."}
};
var PA_STYLE_ORDER=["ext","con","opn","agr","emo"];
function PA_styleScores(R){
  var by={};PA_STYLE_ITEMS.forEach(function(it){var raw=R[it.id];if(raw==null)return;var v=it.reverse?6-raw:raw;(by[it.dim]=by[it.dim]||[]).push(v);});
  var out={};PA_STYLE_ORDER.forEach(function(dim){var a=by[dim];out[dim]=a&&a.length?a.reduce(function(s,x){return s+x;},0)/a.length:3;});
  return out;
}
function PA_style(R){
  var sc=PA_styleScores(R);
  return PA_STYLE_ORDER.map(function(dim){
    var v=sc[dim], D=PA_STYLE, def=D[dim], side=v>=3.4?"hi":(v<=2.6?"lo":"mid");
    return {dim:dim,title:def.title,lo:def.lo,hi:def.hi,pos:Math.round((v-1)/4*100),side:side,
      strength:side==="hi"?def.hiStrength:side==="lo"?def.loStrength:def.midStrength,
      skill:side==="hi"?def.hiSkill:side==="lo"?def.loSkill:""};
  });
}
function PA_score(R){
  var byKey={};
  PA_ITEMS.forEach(function(it){var raw=R[it.id];if(raw==null)return;var val=it.reverse?6-raw:raw;var k=it.construct+":"+it.subscale;(byKey[k]=byKey[k]||[]).push(val);});
  function mean(a){return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
  var s={};for(var k in byKey)s[k]=mean(byKey[k]);
  function g(k){return s[k]!=null?s[k]:3;}
  var reinvestment=(g("reinvestment:conscious_motor_processing")+g("reinvestment:movement_self_consciousness")+g("reinvestment:decision_reinvestment"))/3;
  return {somatic:g("anxiety:somatic"),worry:g("anxiety:worry"),concentration:g("anxiety:concentration"),
    debilitative:g("direction:interpretation"),reinvestment:reinvestment,efficacy:g("self_efficacy:confidence"),
    sensation:g("sensation:seeking"),promotion:g("regulatory:promotion"),
    prevention:g("regulatory:prevention"),monitoring:g("coping:monitoring"),negativeSelfTalk:g("selftalk:negative"),flow:g("flow:disposition"),
    /* --- fix 2: previously-collected-but-unscored items now consumed --- */
    masteryApproach:g("achievement:mastery_approach"),performanceAvoidance:g("achievement:performance_avoidance"),
    blunting:g("coping:blunting"),instructionalSelfTalk:g("selftalk:instructional"),
    /* v12 provisional: behavioral-avoidance response (exploratory, app-original) */
    avoidance:g("avoidance:behavioral")};
}
var PA_PATHWAYS=[
  {id:"regulation",label:"Arousal & worry regulation",colour:"#46B3A9",
   score:function(c){return 0.30*PA_n01(c.somatic)+0.30*PA_n01(c.worry)+0.25*PA_n01(c.debilitative)+0.15*(1-PA_n01(c.efficacy));},
   factors:[{k:"somatic",w:0.30,label:"how much your body tenses up"},{k:"worry",w:0.30,label:"pre-dive worry"},{k:"debilitative",w:0.25,label:"reading nerves as a bad sign"},{k:"efficacy",w:0.15,invert:true,label:"less trust in staying in control"}],
   lead:"Managing physical activation and pre-dive worry is where your profile points most strongly \u2014 one of the best-evidenced areas to train."},
  {id:"attentional_control",label:"Attentional control & automaticity",colour:"#2E7D97",
   score:function(c){return 0.55*PA_n01(c.reinvestment)+0.30*PA_n01(c.concentration)+0.15*(1-PA_n01(c.worry));},
   factors:[{k:"reinvestment",w:0.55,label:"over-controlling movements you already own"},{k:"concentration",w:0.30,label:"attention drifting under pressure"},{k:"worry",w:0.15,invert:true,label:"relatively low worry"}],
   lead:"Keeping attention where it belongs \u2014 and letting well-trained skills run themselves rather than over-controlling them \u2014 is where your profile points most strongly."},
  /* v12 provisional: third pathway for coverage (confidence / self-belief / flow). Weights reasoned, NOT validated. */
  {id:"confidence_flow",label:"Confidence & flow",colour:"#3E8FA6",provisional:true,

   lead:"Building durable self-belief \u2014 and getting out of your own way so absorbed focus can happen \u2014 is where your profile points most strongly."}
];
function PA_route(c){
  var raw=PA_PATHWAYS.map(function(p){return {id:p.id,ref:p,raw:Math.max(0,p.score(c))};});
  var total=raw.reduce(function(s,x){return s+x.raw;},0)||1;
  raw.forEach(function(x){x.pct=Math.round((x.raw/total)*100);});
  var drift=100-raw.reduce(function(s,x){return s+x.pct;},0); if(raw.length)raw[0].pct+=drift;
  raw.sort(function(a,b){return b.raw-a.raw;});
  /* blend flag uses PA_BLEND_MARGIN so it can't silently drift from PA_resolve's
     routing after calibration. NOTE: this compares the top-two PATHWAY pcts here,
     whereas PA_resolve applies the same margin after the full 3-pathway split \u2014
     slightly different geometries. Kept linked deliberately (same "is this person
     balanced?" concept); decouple only if real data shows they should differ.
     PA_BLEND_MARGIN is assigned below; PA_route is never called before then. */
  return {ranked:raw,dominant:raw[0],blend:(raw.length>1&&Math.abs(raw[0].pct-raw[1].pct)<=PA_BLEND_MARGIN)};
}
function PA_mods(c){
  var m=[];
  if(c.negativeSelfTalk>=3.5)m.push({tag:"Self-talk",text:"Frequent negative self-talk \u2014 layer in reframing and a prepared cue script."});
  /* fix 2: instructional self-talk now scored (selftalk:instructional). Low use = opportunity to add cue-words. */
  if(c.instructionalSelfTalk<=2.5)m.push({tag:"Self-talk",text:"You make little use of instructional cue-words \u2014 building a short prepared cue script (\u201crelax shoulders\u201d, \u201cslow exhale\u201d) is a quick, well-evidenced gain."});
  /* fix 2: coping style now uses the real blunting item alongside monitoring, not monitoring alone. */
  if(c.monitoring>=3.5&&c.blunting<=2.5)m.push({tag:"Coping style",text:"You lean toward monitoring (wanting internal detail). Surface the sensations rather than hiding them \u2014 but pair with tolerance framing."});
  if(c.blunting>=3.5&&c.monitoring<2.5)m.push({tag:"Coping style",text:"You lean toward blunting (less internal detail). Favour distraction / automaticity cues and keep sensation dashboards minimal."});
  if(c.promotion-c.prevention>=1)m.push({tag:"Framing",text:"Promotion-focused \u2014 goals framed as gains (\u201cextend your range\u201d) will fit you better."});
  if(c.prevention-c.promotion>=1)m.push({tag:"Framing",text:"Prevention-focused \u2014 goals framed as safety/control (\u201cstay calm and controlled\u201d) will fit you better."});
  /* fix 2: achievement-goal orientation now scored (achievement:*). Avoidance-dominant profiles benefit from mastery reframing. */
  if(c.performanceAvoidance-c.masteryApproach>=1)m.push({tag:"Goal focus",text:"Performance-avoidance leaning \u2014 reframing targets around personal mastery (\u201cimprove the skill\u201d) rather than not-failing tends to lower pressure and sustain motivation."});
  if(c.masteryApproach-c.performanceAvoidance>=1.5)m.push({tag:"Goal focus",text:"Strong mastery orientation \u2014 a real asset; keep goals framed around skill improvement and it will keep driving steady progress."});
  return m;
}
function PA_nft(routing){
  return {device:"Muse EEG headband + auxiliary lead \u2248 Cz (approximate central-band rhythm)",
    fid:"Muse reads frontal/temporal band power well; a true sensorimotor-rhythm (SMR) montage is approximated, not measured \u2014 any SMR-style target is labelled as an approximation.",
    primary:routing.dominant.ref.id==="regulation"?"Down-regulate pre-session hyperarousal (frontal-alpha up-regulation / calm-state training)":"Support quiet, non-over-engaged processing (approx. SMR up-regulation)",
    secondary:routing.dominant.ref.id==="regulation"?"Frontal-alpha stability for a settled, sustained state":"External-focus attention anchoring with alpha-reactivity feedback",
    length:"6 short sessions over ~3 weeks; a sham-control comparison is recommended before any effect is claimed",
    guard:["Dry, pre-dive mental preparation only \u2014 never in-water or live breath-hold supervision.","Log-only breath-hold metrics; live guided holds are reserved for the expert tier with a required present supervisor.","All EEG outputs are exploratory \u2014 no biomarker is shown as ground truth."]};
}
/* pathway id -> in-app programs + the mechanism sentence that explains the pairing */
var PA_PROGMAP={
  regulation:{nf:"calm",mw:"nerves",mech:"The module trains a settling frontal-alpha state \u2014 calm on command \u2014 and the program reframes the nerves themselves instead of fighting them."},
  attentional_control:{nf:"focus",mw:"focus",mech:"The module gives feedback on a quiet, non-over-engaged state (approx. SMR), and the program loosens step-by-step self-control so trained technique can run itself."},
  /* v12 provisional: confidence_flow -> existing Confidence & self-belief program. nf left as calm pending a flow-vs-belief split decision. */
  confidence_flow:{nf:"calm",mw:"confidence",mech:"The program surfaces and tests the core beliefs under the doubt, and the module trains a settled state that makes absorbed, self-forgetting focus easier to reach.",provisional:true}
};
function PA_explain(c,path){
  return (path.factors||[]).map(function(x){var v01=x.invert?(1-PA_n01(c[x.k])):PA_n01(c[x.k]);return {label:x.label,val:c[x.k],contrib:x.w*v01};}).sort(function(a,b){return b.contrib-a.contrib;});
}
/* fix 3: panic-literacy swap is now an explicit, inspectable gate rather than a
   label-substring match. It fires ONLY when the profile is genuinely body-led:
   (a) somatic is elevated in absolute terms (>= PA_PANIC_SOMATIC_MIN), AND
   (b) somatic clearly leads the other anxiety components (worry, concentration)
       by a margin (>= PA_PANIC_SOMATIC_LEAD).
   A neutral (all-3) profile fails (a), so it can never route to a clinical
   panic program. Thresholds are named constants so they are easy to review/tune. */
var PA_PANIC_SOMATIC_MIN=3.5;    /* somatic must be at least "quite a bit"-ish */
var PA_PANIC_SOMATIC_LEAD=0.5;   /* and lead worry & concentration by >= this */
function PA_panicGate(c){
  return c.somatic>=PA_PANIC_SOMATIC_MIN
      && (c.somatic-c.worry)>=PA_PANIC_SOMATIC_LEAD
      && (c.somatic-c.concentration)>=PA_PANIC_SOMATIC_LEAD;
}
function PA_reco(c,routing){
  var dom=routing.dominant.ref, map=PA_PROGMAP[dom.id]||{}, drivers=PA_explain(c,dom), mw=map.mw;
  if(dom.id==="regulation"&&PA_panicGate(c))mw="panic"; /* body-led -> panic literacy (explicit gate) */
  return {nf:map.nf,mw:mw,mech:map.mech,drivers:drivers,swapped:(mw!==map.mw)};
}
/* ============================================================================
   v12 PROVISIONAL: two-input routing (scores + stated goal).
   Rationale: when the score profile is DIFFERENTIATED, scores lead and a stated
   goal is surfaced as a secondary thread. When the profile is BALANCED (no
   pathway leads by PA_BLEND_MARGIN), the tool ACKNOWLEDGES the balance and lets
   the person's stated goal orient the plan \u2014 labelled as goal-driven, not
   score-detected. Goals that are situation-defined (setback, avoidance) route by
   the MECHANISM the assessment measured, not to a single fixed program.
   PA_BLEND_MARGIN is provisional and must be set from real intake data before
   this drives live recommendations (validate-before-routing checkpoint).
   ========================================================================== */
var PA_BLEND_MARGIN=12; /* PROVISIONAL \u2014 set empirically from real distribution */
/* goal id -> how it routes. type:"pathway" defers to a pathway; type:"program"
   goes straight to a program; type:"mechanism" picks a program from the profile. */
var PA_GOALS=[
  {id:"calm_nerves",  label:"Calm my dive-day nerves",                    type:"pathway",  pathway:"regulation"},
  {id:"overthinking", label:"Stop overthinking / micromanaging my technique", type:"pathway", pathway:"attentional_control"},
  {id:"depth_confidence", label:"Build confidence to push a deeper depth", type:"pathway", pathway:"confidence_flow"},
  {id:"flow",         label:"Get into flow more consistently",            type:"pathway",  pathway:"confidence_flow", note:"shares the focus program provisionally", provProgram:"focus"},
  {id:"body_panic",   label:"Handle strong body sensations / panic",      type:"program",  program:"panic"},
  {id:"avoidance",    label:"Approach something I've been putting off",    type:"mechanism", context:"avoidance"},
  {id:"setback",      label:"Bounce back from a setback",                 type:"mechanism", context:"setback"},
  {id:"none",         label:"Not sure yet / general foundation",          type:"none"}
];
function PA_goal(id){for(var i=0;i<PA_GOALS.length;i++)if(PA_GOALS[i].id===id)return PA_GOALS[i];return null;}

/* Given a balanced/ambiguous situation-goal, choose a program by which mechanism
   dominates the person's measured response. Uses constructs the engine already
   scores (reinvestment, negativeSelfTalk/avoidance, avoidance:behavioral). */
function PA_mechanismProgram(c,context){
  /* three candidate mechanisms, scored 0..1 */
  var mAvoid = PA_n01(c.avoidance);                 /* behavioral retreat -> fear ladder */
  var mReinv = PA_n01(c.reinvestment);              /* over-analysis / control -> focus  */
  var mSelf  = 0.5*PA_n01(c.negativeSelfTalk)+0.5*(1-PA_n01(c.efficacy)); /* harsh self-judgement -> setback */
  var ranked=[{m:"fear",v:mAvoid,label:"behavioral avoidance"},
              {m:"focus",v:mReinv,label:"over-analysis / reinvestment"},
              {m:"setback",v:mSelf,label:"harsh self-judgement & withdrawal"}];
  ranked.sort(function(a,b){return b.v-a.v;});
  var lead=ranked[0].v-ranked[1].v;
  return {program:ranked[0].m, driver:ranked[0].label, ranked:ranked,
          decisive:(lead>=0.11), /* provisional; 0.11 sits just under the 0.125 scale-step so a one-point mechanism lead reliably routes despite float rounding */
          fallback:(context==="setback"?"setback":"fear")};
}

/* Master routing: returns a resolved plan + an explicit, honest "basis" tag. */
function PA_resolve(c,routing,goalId){
  var goal=PA_goal(goalId||"none");
  var lead=routing.ranked.length>1?(routing.ranked[0].pct-routing.ranked[1].pct):100;
  var scoreLed=lead>=PA_BLEND_MARGIN;
  /* situation/mechanism goals resolve by measured response, independent of pathway */
  if(goal&&goal.type==="mechanism"){
    var mp=PA_mechanismProgram(c,goal.context);
    var prog=mp.decisive?mp.program:mp.fallback;
    return {basis:"goal+mechanism",program:prog,nf:(prog==="focus"?"focus":"calm"),
            note:"Your goal is situation-defined; the plan follows how you tend to respond ("+mp.driver+").",
            mechanism:mp,goal:goal,scoreLed:scoreLed,balanced:!scoreLed};
  }
  if(goal&&goal.type==="program"){
    var pm=PA_PROGMAP; var nf=(goal.program==="panic"?"calm":"calm");
    return {basis:"goal+program",program:goal.program,nf:nf,
            note:"Routed to the program your stated goal names directly.",goal:goal,scoreLed:scoreLed,balanced:!scoreLed};
  }
  if(scoreLed){
    /* scores lead; goal (if any & different) becomes a secondary thread */
    var reco=PA_reco(c,routing);
    var goalPath=(goal&&goal.type==="pathway")?goal.pathway:null;
    var secondary=(goalPath&&goalPath!==routing.dominant.ref.id)?goalPath:null;
    return {basis:"score-led",program:reco.mw,nf:reco.nf,mech:reco.mech,swapped:reco.swapped,
            secondaryPathway:secondary,goal:goal,scoreLed:true,balanced:false,
            note:secondary?"Your scores point clearly here; your stated goal is queued as a secondary focus.":"Your scores point clearly to this focus."};
  }
  /* BALANCED: acknowledge, then let the goal orient */
  if(goal&&goal.type==="pathway"){
    var map=PA_PROGMAP[goal.pathway]||{};
    var prog=goal.provProgram||map.mw;
    return {basis:"balanced+goal",program:prog,nf:map.nf||"calm",
            note:"Your profile is evenly balanced across areas \u2014 a stable platform, not a deficit. Since no single area stands out, your plan follows the goal you chose.",
            goal:goal,scoreLed:false,balanced:true};
  }
  /* balanced + no goal -> foundational */
  return {basis:"balanced+foundational",program:"foundational",nf:null,
          note:"Your profile is evenly balanced across areas \u2014 a genuine strength. There's no single stand-out to target, so a short foundational program fits best. Pick a goal any time to focus the work.",
          goal:goal,scoreLed:false,balanced:true};
}

var MEM={}; var HAS_STORE=(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function");
async function sGet(k){
  if(HAS_STORE){try{var r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}
  return (k in MEM)?JSON.parse(MEM[k]):null;
}
async function sSet(k,v){
  var s=JSON.stringify(v);
  if(HAS_STORE){try{await window.storage.set(k,s);return true;}catch(e){}}
  MEM[k]=s;return true;
}
async function sDel(k){
  if(HAS_STORE){try{await window.storage.delete(k);return;}catch(e){}}
  delete MEM[k];
}

function parseHash(){
  var h=location.hash||"";
  var m=h.match(/^#\/a\/([a-z0-9]+)/i);       // respondent assessment link
  if(m)return {kind:"assess",token:m[1]};
  var p=h.match(/^#\/r\/([a-z0-9]+)/i);        // shared result (user portal deep link)
  if(p)return {kind:"result",token:p[1]};
  return {kind:"app"};
}

  for(var pid in DB.assessments){var a=DB.assessments[pid];if(a&&a.token===tok)return {pid:pid,a:a};}
  return null;
}
function ensureAssessment(pid){
  if(!DB.assessments[pid]){

      started:null,completed:null,profile:null,resolved:null,
      share:{granted:false,mode:"curated",items:defaultShareItems()}};

  if(!DB.assessments[pid].share)DB.assessments[pid].share={granted:false,mode:"curated",items:defaultShareItems()};

}

function adminShell(inner){
  var nav=[["dashboard","Dashboard",IC.dash],["people","People",IC.people],["results","Results",IC.results]];
  var titleMap={dashboard:["Dashboard","Overview of assessments and activity"],
    people:["People","Your assessment list — invite, track, and open results"],
    results:["Results","Completed profiles — review, curate sharing, export PDFs"]};
  var t=titleMap[UI.route]||["Inner Depths",""];
  return '<div class="app">'
    +'<aside class="side">'
      +'<div class="logo"><img src="'+LOGO+'" alt=""/><div><div class="bt1">Inner&nbsp;<span>Depths</span></div><div class="bt2">Assessment Platform</div></div></div>'
      +'<nav class="nav">'+nav.map(function(n){return '<button data-nav="'+n[0]+'" class="'+(UI.route===n[0]?"on":"")+'">'+ico(n[2])+'<span>'+n[1]+'</span></button>';}).join("")+'</nav>'
      +'<div class="foot">Interim testing tool. Supports dry training &amp; pre-dive mental preparation only. Results are provisional (v12) and awaiting validation before driving live recommendations.</div>'
    +'</aside>'
    +'<main class="main">'
      +'<div class="topbar"><div><h1>'+esc(t[0])+'</h1><div class="sub">'+esc(t[1])+'</div></div>'
        +(UI.route==="people"?'<button class="btn btn-primary" data-act="addPerson">'+ico(IC.plus)+'Add person</button>':'')
      +'</div>'
      +'<div class="wrap">'+inner+'</div>'
    +'</main>'
  +'</div>';
}

/* ---------- Dashboard ---------- */
function viewDashboard(){
  var ppl=DB.people.length;
  var invited=0,progress=0,complete=0,shared=0;
  DB.people.forEach(function(p){var a=DB.assessments[p.id];if(!a){invited++;return;}
    if(a.status==="complete")complete++;else if(a.status==="progress")progress++;else invited++;
    if(a.share&&a.share.granted)shared++;});
  var recent=DB.people.slice().map(function(p){return {p:p,a:DB.assessments[p.id]};})
    .filter(function(x){return x.a&&x.a.completed;})
    .sort(function(a,b){return b.a.completed-a.a.completed;}).slice(0,5);

  var s=''
    +'<div class="grid k4">'
      +stat("People",ppl,"in your list")
      +stat("Completed",complete,"profiles ready")
      +stat("In progress",progress,"started, not done")
      +stat("Shared",shared,"granted to users")
    +'</div>';
  s+='<div class="card" style="margin-top:16px">'
    +'<div class="sec-h"><h2>Recently completed</h2>'+(recent.length?'<button class="btn btn-sm" data-nav="results">View all</button>':'')+'</div>';
  if(!recent.length){
    s+=emptyBlock(IC.chart,"No completed assessments yet","Add a person, send them the assessment link, and their profile will appear here once finished.");
  }else{
    s+='<table><thead><tr><th>Name</th><th>Profile</th><th>Completed</th><th>Sharing</th><th></th></tr></thead><tbody>';
    recent.forEach(function(x){
      s+='<tr class="rowhover"><td class="tname">'+esc(x.p.name)+'</td>'
        +'<td>'+(x.a.profile?esc(x.a.profile.label):"—")+'</td>'
        +'<td class="tsub">'+fmtDate(x.a.completed)+'</td>'
        +'<td>'+shareBadge(x.a)+'</td>'
        +'<td style="text-align:right"><button class="btn btn-sm" data-open="'+x.p.id+'">Open</button></td></tr>';
    });
    s+='</tbody></table>';
  }
  s+='</div>';
  s+='<div class="notice" style="margin-top:16px">'+ico(IC.info)+' &nbsp;This is an interim tool for testing the Performance Assessment engine. Nothing here is a diagnosis; every profile is provisional pending validation against real intake data.</div>';
  return s;
}
function stat(k,v,d){return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v mono">'+v+'</div><div class="d">'+esc(d)+'</div></div>';}
function emptyBlock(icn,h,sub){return '<div class="empty"><div class="ei">'+ico(icn)+'</div><h3>'+esc(h)+'</h3><p>'+esc(sub)+'</p></div>';}

/* ---------- People list ---------- */
function statusBadge(a){
  if(!a||a.status==="invited")return '<span class="badge b-invited"><i></i>Invited</span>';
  if(a.status==="progress")return '<span class="badge b-progress"><i></i>In progress</span>';

/* ============================================================
   RESULT RENDERER — computes engine output & renders sections.
   Used by: admin full view, curated user view, and PDF/print.
   opts: {curated:bool, items:{summary,plan,drivers,style,neuro,resolution}, mode:'long'|'summary', personName}
   ============================================================ */

/* Run the verbatim engine over stored responses. Mirrors v12 renderPAResult. */
function computeResult(a){
  var R=a.responses||{}, ST=a.state||{};
  var c=PA_score(R);
  var routing=PA_route(c);
  var dom=routing.dominant.ref;
  var rec=PA_reco(c,routing);
  var nft=PA_nft(routing);
  var mods=PA_mods(c);
  var style=PA_style(R);
  var resolved=PA_resolve(c,routing,a.goal||"none");
  return {c:c,routing:routing,dom:dom,rec:rec,nft:nft,mods:mods,style:style,resolved:resolved,state:ST};
}

/* Persist a compact profile snapshot for list views. */
function snapshotProfile(a){
  try{
    var r=computeResult(a);
    a.profile={id:r.dom.id,label:r.dom.label,pct:r.routing.dominant.pct,
      nf:r.rec.nf,mw:r.rec.mw};
    a.resolved={basis:r.resolved.basis,note:r.resolved.note};
  }catch(e){a.profile=null;}
}

function basisTag(b){return {"score-led":"Scores lead","balanced+goal":"Balanced — goal leads",
  "balanced+foundational":"Balanced — foundational","goal+mechanism":"Goal — by response style",
  "goal+program":"Goal — direct"}[b]||b;}

function renderResult(a,opts){
  opts=opts||{}; var items=opts.items||defaultShareItems(); var curated=!!opts.curated; var summaryOnly=(opts.mode==="summary");
  var r=computeResult(a);
  var dom=r.dom, routing=r.routing, rec=r.rec;

  // In curated mode, only show enabled items. In admin mode, show all.
  function on(key){ return curated? !!items[key] : true; }

  var out='<div class="result'+(curated?' curated':'')+'">';

  // header line (name / date) for PDF context
  if(opts.personName){
    out+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">'
      +'<div class="eye">Performance profile</div>'
      +'<div class="tsub">'+esc(opts.personName)+' · '+fmtDate(a.completed)+'</div></div>';
  }

  /* 1. SUMMARY HERO */
  if(on("summary")){
    var splitBar=routing.ranked.map(function(x){return '<span style="width:'+x.pct+'%;background:'+x.ref.colour+'"></span>';}).join("");
    var splitLeg=routing.ranked.map(function(x){return '<span><i style="background:'+x.ref.colour+'"></i>'+esc(x.ref.label)+' · '+x.pct+'%</span>';}).join("");
    var foM=nfMod("foundation"), nfM=nfMod(rec.nf), mwP=mwProg(rec.mw);
    out+='<div class="pa-summary"><div class="eye">Your profile · at a glance</div>'
      +'<h2>'+esc(dom.label)+'</h2><p>'+esc(dom.lead)+'</p>'
      +'<div class="pa-splitbar">'+splitBar+'</div><div class="pa-splitleg">'+splitLeg+'</div>'
      +(routing.blend?'<p style="margin-top:10px;font-size:.82rem;color:var(--lumen)">Your top two areas are close — a <b style="color:#fff">blended profile</b>. Start with the lead, borrow from the next when a session calls for it.</p>':'')
      +'<div class="pa-mini"><b>Do next:</b> 1 · set your baseline &nbsp;→&nbsp; 2 · '+esc(foM.n)+' &nbsp;→&nbsp; 3 · '+esc(nfM.n)+' + '+esc(mwP.n)+'</div>'
    +'</div>';
  }

  if(summaryOnly){
    // Summary form: hero + a one-line plan + provisional disclaimer only.
    out+='<div class="res-caveat">Provisional (v12). This snapshot reflects the two-input routing (assessment scores + stated goal); blend margin and adapted items are awaiting validation before driving live recommendations. Dry training &amp; pre-dive preparation only.</div>';
    out+='</div>';
    return out;
  }

  /* 1b. PROVISIONAL RESOLUTION PANEL (admin, or if shared) */
  if(on("resolution")){
    var res=r.resolved;
    var gLabel=(res.goal&&res.goal.id!=="none")?res.goal.label:null;
    out+='<div class="prov-panel"><div class="ph">'
      +'<div class="pl">How this plan was decided <span class="pf">· provisional</span></div>'
      +'<span class="prov-tag">'+esc(basisTag(res.basis))+'</span></div>'
      +(gLabel?'<div class="pd"><b>Goal:</b> '+esc(gLabel)+'</div>':'<div class="pd" style="color:var(--ink-soft)">No goal set — general foundation.</div>')
      +'<div class="pd">'+esc(res.note)+'</div>'
      +(res.secondaryPathway?'<div class="pd" style="color:var(--tidal)">Secondary thread queued: <b>'+esc(res.secondaryPathway)+'</b> (from goal).</div>':'')
      +(res.mechanism?'<div class="pd" style="color:var(--ink-soft);font-size:.8rem">Response-style read: '+res.mechanism.ranked.map(function(x){return esc(x.label)+" "+Math.round(x.v*100)+"%";}).join(" · ")+'</div>':'')
      +'<div class="prov-fine">v12 two-input routing (scores + stated goal). Blend margin (PA_BLEND_MARGIN) and adapted items are provisional and awaiting validation against real data before driving live recommendations.</div>'
    +'</div>';
  }

  /* 2. PLAN */
  if(on("plan")){
    var foM2=nfMod("foundation"), nfM2=nfMod(rec.nf), mwP2=mwProg(rec.mw);
    out+='<div class="res-sec"><span class="eye">Your starting plan</span>'
      +'<p class="rintro">Because <b>'+esc(dom.label.toLowerCase())+'</b> leads, we pair a matched neurofeedback module with a Mind Work program. Follow the path top to bottom.</p>'
      +'<div class="pa-flow">'
        +planNode("var(--current)","1","Set your baseline","First","A subjective check-in and a short resting capture so the sensors calibrate to you.")
        +planNode(foM2.c,"2",foM2.n,"Foundation","A calm breathing lead-in that runs under every pathway.")
        +planNode(nfM2.c,"3",nfM2.n,"Neurofeedback","Matched to your focus · exploratory.")
        +planNode(mwP2.c,"4",mwP2.n,"Mind Work","CBT for performance, matched to your focus."+(rec.swapped?" Body signals led, so this leans on panic-literacy.":""))
      +'</div>';
    if(r.mods.length){
      out+='<div class="card" style="background:var(--seafoam);border:none;margin-top:10px"><div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tidal)">Personal tweaks</div>';
      r.mods.forEach(function(m){out+='<div style="font-size:.86rem;color:var(--depth);line-height:1.5;margin-top:6px"><b>'+esc(m.tag)+':</b> '+esc(m.text)+'</div>';});
      out+='</div>';
    }
    out+='</div>';
  }

  /* 3. DRIVERS */
  if(on("drivers")){
    var top=rec.drivers.slice(0,3), tot=top.reduce(function(s,x){return s+x.contrib;},0)||1;
    var sa=r.state.state_arousal||3;
    var today=sa>=4?"You're arriving over-aroused — lead with the breathing down-regulation before anything technical."
      :sa<=2?"You're arriving flat — a short activating routine before the main work fits better today."
      :"You're arriving in a workable middle band — go straight into your focus area.";
    out+='<div class="res-sec"><span class="eye">Why this is your focus</span>'
      +'<p class="rintro">These answers pushed hardest toward your leading area — the taller the bar, the more it shaped the result.</p><div class="card">';
    top.forEach(function(dr){var share=Math.round(dr.contrib/tot*100);
      out+='<div class="pa-dbar"><span class="lb">'+esc(dr.label)+'</span><div class="tk"><span style="width:'+Math.max(6,share)+'%"></span></div><span class="vl mono">'+share+'%</span></div>';});
    out+='</div><div class="rintro" style="margin-top:10px"><b>Today:</b> '+esc(today)+'</div></div>';
  }

  /* 4. STYLE */
  if(on("style")){
    out+='<div class="res-sec"><span class="eye">Your style</span>'
      +'<p class="rintro">No style here is better than another — they only change how we coach you. Light indications; the tendencies (and the skills that pair with them) are trainable.</p>';
    r.style.forEach(function(sd){var mpos=Math.max(6,Math.min(94,sd.pos));
      out+='<div class="card"><div class="style-row"><div class="st">'+esc(sd.title)+'</div>'
        +'<div class="style-track"><span class="end'+(sd.side==="lo"?" on":"")+'">'+esc(sd.lo)+'</span>'
        +'<div class="bar"><span style="left:'+mpos+'%"></span></div>'
        +'<span class="end r'+(sd.side==="hi"?" on":"")+'">'+esc(sd.hi)+'</span></div>'
        +'<div class="style-strength">'+esc(sd.strength)+'</div></div></div>';
    });
    out+='</div>';
  }

  /* 5. NEUROFEEDBACK (admin-only by default) */
  if(on("neuro")){
    var nft=r.nft;
    out+='<div class="res-sec"><span class="eye">Neurofeedback detail</span>'
      +'<div class="card"><span class="pill-ex">Exploratory</span>'
      +'<p class="rintro" style="margin:8px 0 10px">'+esc(nft.fid)+'</p>'
      +'<div class="nf-row"><span class="nk">Device</span><span class="nv">'+esc(nft.device)+'</span></div>'
      +'<div class="nf-row"><span class="nk">Primary</span><span class="nv">'+esc(nft.primary)+'</span></div>'
      +'<div class="nf-row"><span class="nk">Secondary</span><span class="nv">'+esc(nft.secondary)+'</span></div>'
      +'<div class="nf-row"><span class="nk">Structure</span><span class="nv">'+esc(nft.length)+'</span></div></div></div>';
  }

  /* 6. FULL CONSTRUCT PROFILE (expert extra) */
  if(on("constructs")){
    var cc=r.c;
    var rows=[["Somatic anxiety",cc.somatic],["Cognitive worry",cc.worry],["Concentration disruption",cc.concentration],
      ["Debilitative interpretation",cc.debilitative],["Reinvestment / over-control",cc.reinvestment],
      ["Self-efficacy",cc.efficacy],["Sensation-seeking",cc.sensation]];
    out+='<div class="res-sec"><span class="eye">Full construct profile</span>'
      +'<p class="rintro">The underlying scores behind the pathway split \u2014 each on the 1\u20135 response scale.</p><div class="card">';
    rows.forEach(function(row){
      var val=(row[1]==null||isNaN(row[1]))?null:row[1];
      var w=(val==null)?2:Math.round(Math.max(2,(val-1)/4*100));
      out+='<div class="pa-dbar"><span class="lb" style="flex-basis:48%;font-size:.84rem">'+esc(row[0])+'</span>'
        +'<div class="tk"><span style="width:'+w+'%;background:var(--current)"></span></div>'
        +'<span class="vl mono">'+(val==null?"\u2014":val.toFixed(1)+"/5")+'</span></div>';
    });
    out+='</div></div>';
  }

  /* 7. ALSO CONSIDER \u2014 non-dominant pathways (expert extra) */
  if(on("alternates")){
    var alts=routing.ranked.slice(1);
    if(alts.length){
      out+='<div class="res-sec"><span class="eye">Also consider</span>'
        +'<p class="rintro">The pathways that did not lead \u2014 useful context for what a shifted profile would surface.</p>';
      alts.forEach(function(x){
        out+='<div class="card" style="margin-top:8px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
          +'<span style="width:10px;height:10px;border-radius:3px;background:'+x.ref.colour+'"></span>'
          +'<span style="font-weight:600;color:var(--depth);font-size:.92rem">'+esc(x.ref.label)+'</span>'
          +'<span class="mono" style="margin-left:auto;font-size:.82rem;color:var(--current);font-weight:600">'+x.pct+'%</span></div>'
          +'<div style="font-size:.86rem;color:var(--ink-soft);line-height:1.5">'+esc(x.ref.lead)+'</div></div>';
      });
      out+='</div>';
    }
  }

  out+='<div class="res-caveat">Provisional (v12). Every profile reflects two-input routing (scores + stated goal); blend margin and adapted items await validation before driving live recommendations. This tool supports dry training and pre-dive mental preparation only — never in-water coaching or live breath-hold supervision.</div>';
  out+='</div>';
  return out;
}
function planNode(color,num,title,kicker,desc){
  return '<div class="pa-node"><div class="num" style="background:'+color+'">'+num+'</div>'
    +'<div><div class="nk">'+esc(kicker)+'</div><div class="nt">'+esc(title)+'</div><div class="nd">'+esc(desc)+'</div></div></div>';
}

/* nfMod / mwProg / colour helpers — small maps mirroring the app's labels. */
function nfMod(id){var m={
  foundation:{n:"Foundation calm",c:"#2E7D97"},
  calm:{n:"Down-regulation training",c:"#2E7D97"},
  focus:{n:"Attention-stability training",c:"#46B3A9"},
  stability:{n:"Focus-stability training",c:"#46B3A9"}
};return m[id]||{n:(id?id:"Foundation"),c:"#2E7D97"};}
function mwProg(id){var m={
  nerves:{n:"Dive-day nerves",c:"#2E7D97"},
  confidence:{n:"Confidence & self-belief",c:"#3E8FA6"},

  var foot='<button class="btn" data-close="1">Cancel</button><button class="btn btn-primary" data-saveShare="'+pid+'">Save sharing</button>';
